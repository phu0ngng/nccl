.pre_submit:
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/
      when: always

.post_submit:
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(post-submit|nightly|weekly)$/
      when: always

.nightly:
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(nightly|weekly)$/
      when: always

.weekly:
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(weekly)$/
      when: always

.ipp6:
  rules:
    - if: $RUN_ON_IPP6 == "1"
      when: always
  tags:
    - ipp6-nccl
  variables:
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}" # Use a unique path for each job to avoid conflicts

.dgxspark:
  rules:
    - if: $RUN_ON_DGXSPARK == "1"
      when: always
  tags:
    - ipp6-nccl
  variables:
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}" # Use a unique path for each job to avoid conflicts

.eos:
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
  tags:
    - nccl-eos

.cw-dfw:
  rules:
