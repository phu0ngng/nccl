variables:
  ##
  # Cluster-specific paths
  # Used by setup and test jobs to install/reference build artifacts
  #
  # EOS cluster
  EOS_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  EOS_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  EOS_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # CW-DFW cluster
  CW_DFW_INSTALL_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}"
  CW_DFW_CI_BUILDS_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/builds"
  CW_DFW_ARCHIVER_STAGING_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/builds"
  # DRACO-OCI cluster
  DRACO_OCI_INSTALL_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}"
  DRACO_OCI_ARCHIVER_STAGING_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/builds"
  # PRE-NYX cluster
  PRE_NYX_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  PRE_NYX_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  PRE_NYX_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # PRE-TYCHE cluster
  PRE_TYCHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  PRE_TYCHE_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  PRE_TYCHE_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # THEIA cluster
  THEIA_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  THEIA_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  THEIA_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # BIA cluster
  BIA_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  BIA_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  BIA_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # POLYPHE cluster
  POLYPHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  POLYPHE_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  POLYPHE_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  
  # IPP6 cluster
  IPP6_INSTALL_DIR: "/storage/gitlab-runner/nccl/install/${CI_PIPELINE_ID}"
  DGXSPARK_INSTALL_DIR: "/storage/gitlab-runner/nccl/install-arm/${CI_PIPELINE_ID}"
  # AWS P5 Cluster
  AWS_WORKSPACE_DIR: "/shared/gitlab-runner/nccl-ci/${CI_PIPELINE_ID}"
  # Comprehensive sweep mode: "off", "debug" (1-node intra + 2-node inter), "full" (all scales)
  COMPREHENSIVE_SWEEP: "off"

.ipp6:
  rules:
    - if: $RUN_ON_IPP6 == "1"
      when: always
  tags:
    - ipp6-nccl
  variables:
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}" # Use a unique path for each job to avoid conflicts
    CLUSTER_CONFIG: "docker/clusters/ipp6-slurm-config.sh"
    INSTALL_DIR: "${IPP6_INSTALL_DIR}"
    ARCHIVER_STAGING_DIR: "${IPP6_ARCHIVER_STAGING_DIR}"
    NCCL_HOME: ${INSTALL_DIR}/build
    RUN_MODE: "SRUN_MPI"
    OMPI_MCA_btl: "^openib"
    NCCL_DEBUG: "WARN"

.ipp6-a40:
  extends:
    - .ipp6
  variables:
    SLURM_PARTITION: "a40-cicd"
    NGPUS: 1

.ipp6-a100:
  extends:
    - .ipp6
  variables:
    SLURM_PARTITION: "a100-cicd"
    NGPUS: 2

.dgxspark:
  rules:
    - if: $RUN_ON_DGXSPARK == "1"
      when: always
  tags:
    - ipp6-nccl
  variables:
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}" # Use a unique path for each job to avoid conflicts
    CLUSTER_CONFIG: "docker/clusters/ipp6-dgxspark-config.sh"
    INSTALL_DIR: "${DGXSPARK_INSTALL_DIR}"
    ARCHIVER_STAGING_DIR: "${IPP6_ARCHIVER_STAGING_DIR}"
    NCCL_HOME: ${INSTALL_DIR}/build
    RUN_MODE: "SRUN_MPI"
    NCCL_DEBUG: "WARN"
    NGPUS: 1
    SLURM_PARTITION: dgxspark

.aws:
  rules:
    - if: $RUN_ON_AWS == "1"
      when: always
  tags:
    - ipp6-nccl
  variables:
    GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PROJECT_PATH}" # Use a unique path for each job to avoid conflicts
    CLUSTER_CONFIG: "docker/clusters/aws-config.sh"
    AWS_HEAD_NODE: aws-pcluster-head
    WORKSPACE_DIR: ${AWS_WORKSPACE_DIR}
    NCCL_HOME: ${AWS_WORKSPACE_DIR}/build
    RUN_MODE: "MPI"
    NGPUS: 8
    SLURM_PARTITION: compute

.eos:
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
  tags:
    - nccl-eos
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}"
    CLUSTER_CONFIG: "docker/clusters/eos-config.sh"
    INSTALL_DIR: "${EOS_INSTALL_DIR}"
    ARCHIVER_STAGING_DIR: "${EOS_ARCHIVER_STAGING_DIR}"
    NCCL_HOME: ${INSTALL_DIR}/build
    RUN_MODE: "MPI"
    NGPUS: 8
    SLURM_ACCOUNT: coreai_libraries_nccl
    SRUN: "" # Needs to be empty for CI runner scripts performing cluster jobs
    MPI_PARAMS: "--oversubscribe -n 2 -mca btl tcp,self"
    OMPI_MCA_btl: "^openib"
    NCCL_DEBUG: "WARN"

.cw-dfw:
  rules:
    - if: $RUN_ON_CW_DFW == "1"
      when: always
  tags:
    - nccl-cw-dfw
  variables:
    CI_BUILDS_DIR: "${CW_DFW_CI_BUILDS_DIR}"
