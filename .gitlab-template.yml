      when: always
  tags:
    - prenyx

.pre-tyche:
  rules:
    - if: $RUN_ON_PRE_TYCHE == "1"
      when: always
  tags:
    - ptyche

.theia:
  rules:
    - if: $RUN_ON_THEIA == "1"
      when: always
  tags:
    - lyris

.bia:
  rules:
    - if: $RUN_ON_BIA == "1"
      when: always
  tags:
    - bia

.gc-a40:
  rules:
    - if: $RUN_ON_A40 == "1"
      when: always
  tags:
    - a40

.gc-a100:
  rules:
    - if: $RUN_ON_A100 == "1"
      when: always
  tags:
    - a100

.gc-p100:
  rules:
    - if: $RUN_ON_P100 == "1"
      when: always
  tags:
    - p100

.gc-p40:
  rules:
    - if: $RUN_ON_P40 == "1"
      when: always
