.build:
  stage: build
  timeout: 1 hour
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 48 hrs

.build-x86:
  extends:
    - .build
  tags:
    - ipp6-k8s
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=amd64
    KUBERNETES_CPU_REQUEST: 14
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 64Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi

.build-arm:
  extends:
    - .build
  tags:
    - ipp6-k8s-arm
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=arm64
    KUBERNETES_CPU_REQUEST: 48
    KUBERNETES_CPU_LIMIT: 96
    KUBERNETES_MEMORY_REQUEST: 128Gi
    KUBERNETES_MEMORY_LIMIT: 450Gi

.setup:
  stage: setup
  variables:
    GIT_STRATEGY: none
  script:
    # Delete existing dir in case of a retry
    - rm -rf $INSTALL_DIR
    - mkdir -p $INSTALL_DIR
    - cp -r $BUILD_DIR $INSTALL_DIR/build

.cleanup:
  stage: cleanup
  dependencies: []
  when: on_success
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    # Delete current pipeline's install directory
    - rm -rf $INSTALL_DIR
    # For nightly pipelines, also delete any install directories older than 14 days in the parent directory
    - |
      if [[ $TRIGGER_PIPELINE == "nightly" ]]; then
        INSTALL_PARENT_DIR=$(dirname $INSTALL_DIR)
        echo "Deleting install directories older than 14 days in $INSTALL_PARENT_DIR"
        find $INSTALL_PARENT_DIR -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} \; 2>/dev/null || true
      fi

# Base template for comprehensive sweep jobs
.comprehensive-sweep:
  stage: comprehensive_sweep
  variables:
    PERF_TEST_MODE: "comprehensive_sweep"
    NCCL_DEBUG: "WARN"
  script:
    - bash test/scripts/ci/gitlab-runner-gcperftest.sh
  timeout: 12h
  allow_failure:
    exit_codes: [33]
  artifacts:
    when: always
    paths:
      - "comprehensive_sweep/*.csv"
      - "comprehensive_sweep/*.pdf"
      - "comprehensive_sweep/*.tar.gz"
    expire_in: 30 days
