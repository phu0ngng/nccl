## Stage: setup - Finish!
##

##
## Stage: downstream - Start...
##

# Kicks off an independent CI pipeline on QA nodes
# https://gitlab-master.nvidia.com/xiaojingl/comms_lib_auto/-/blob/main/NCCL_CI/ci_perftest.sh?ref_type=heads
QA-team-ci:
  stage: downstream
  dependencies: []
  rules:
    - <<: *post_submit_rule
    - when: never
  tags:
    - cqa_host_runner
  script:
    - bash $CI_BUILDS_DIR/CI/ci_perftest.sh

nccl4py_ci:
  stage: downstream
  needs:
    - setup-ipp6
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_IPP6 == "1" && $RUN_NCCL4PY_CI == "1"
      when: always
    - when: never
  trigger:
    include: bindings/nccl4py/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

github-sim:
  stage: downstream
  needs: []
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit)$/
      changes:
        paths: *public_paths
    - when: never
  trigger:
    include:
      - project: nccl/ci-infra
        ref: main
        file: github-first/.gitlab-ci.yml
    strategy: depend
  variables:
    CI_INFRA_REF: main
    MODE: sim

