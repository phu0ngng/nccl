apitest-AWS-H100-EFA:
  stage: api_tests
  extends:
    - .aws
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_AWS == "1" && $RUN_API_TESTS == "1"
      when: always
    - when: never
  needs:
    - setup-AWS-H100-EFA
  variables:
    GIT_STRATEGY: none
    RUN_SCRIPT: run_tests.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-api.sh
    JUNIT: junit_results_apitest.xml
    TEST_WORKSPACE_DIR: ${WORKSPACE_DIR}/api
    SLURM_TIME: 20
    NNODES: 1
    NP: 1
    API_TESTS_DEFAULT: 1
    API_TESTS_NO_P2P: 0 # NvBug 5210770
    API_TESTS_NETWORK: 1
    API_TESTS_DEVICE_API: 1
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      #!/bin/bash

      # Gitlab passthrough variables
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH}
      export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      export GITLAB_USER_LOGIN=${GITLAB_USER_LOGIN}

      # CI infra variables
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/clusters/aws-config.sh"
      export SLURM_TIME=$SLURM_TIME
      export SLURM_PARTITION=$SLURM_PARTITION
      export NNODES=$NNODES
      export NGPUS=$NGPUS
      export NP=$NP
      export RUN_MODE=${RUN_MODE}
      export NCCL_HOME=${NCCL_HOME}
      export LD_LIBRARY_PATH=${NCCL_HOME}/lib:${LD_LIBRARY_PATH}
      export JUNIT=${JUNIT}

      # API test variables
      export NCCL_NVLS_ENABLE=0
      export API_TESTS_DEFAULT=$API_TESTS_DEFAULT
      export API_TESTS_NO_P2P=$API_TESTS_NO_P2P
      export API_TESTS_NETWORK=$API_TESTS_NETWORK
      export API_TESTS_DEVICE_API=$API_TESTS_DEVICE_API

      # Launch unit test suite
      salloc -N ${NNODES} --exclusive -J "nccl-ci::${GITLAB_USER_LOGIN}:apitests::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME} -p ${SLURM_PARTITION} $TEST_CMD
      EOF
    - rsync $RUN_SCRIPT $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/
  script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && JUNIT=junit_results_apitest.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $TEST_WORKSPACE_DIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/failed .
    - scp $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/$JUNIT .
    - ls && ls failed && ls $JUNIT
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

