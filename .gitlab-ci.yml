      when: always
    - when: never
  needs: [build, perftest-DGX-1V]
  tags:
    - dgx-1v
  variables:
    MPI_HOME: "/home/svc_nvshmem_ci/mpi/openmpi-1.10.7"
    CUDA_HOME: "/gpfs/fs1/projects/sw_gpucomms/users/svc_nvshmem_ci/cuda/cuda-${CUDA_VERSION}"
    PARTITION_LIST: "batch_short_dgx1_m2"
    UCX_TLS: "tcp"
    NCCL_DEBUG: "INFO"
    NCCL_DEBUG_SUBSYS: "ENV"
    NCCL_IBEXT_DISABLE: "1"
    NNODES: $MULTI_PERFTEST_NODE_COUNT
    NGPUS: 8
    MPI_PARAMS: "-mca btl tcp,self -mca btl_tcp_if_include enp1s0f0"
    SALLOC: "" # Needs to be empty for CI runner scripts performing cluster jobs
    DRACO_SALLOC: "--exclusive --gpus-per-node=8 --ntasks-per-node=8 --account=sw_gpucomms_nvshmem --nv-meta ml-model.nccl-perf --exclusive -t 00:25:00"
  script:
    - let NUM_PROCESSES=$MULTI_PERFTEST_NODE_COUNT*8 && salloc $DRACO_SALLOC -N $MULTI_PERFTEST_NODE_COUNT -n $NUM_PROCESSES -G $NUM_PROCESSES -p $PARTITION_LIST ./test/scripts/gitlab-runner-perftest.sh 1G
  interruptible: true

