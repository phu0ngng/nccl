# Kicks off an independent CI pipeline on QA nodes
# https://gitlab-master.nvidia.com/xiaojingl/comms_lib_auto/-/blob/main/NCCL_CI/ci_perftest.sh?ref_type=heads
QA-team-ci:
  stage: setup
  dependencies: []
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(post-submit|nightly)$/
      when: always
    - when: never
  tags:
    - cqa_host_runner
  script:
    - bash $CI_BUILDS_DIR/CI/ci_perftest.sh

fairshare-eos:
  stage: setup
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_EOS == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1" || $RUN_DLFW_TESTS == "1"))
      when: always
    - when: never
  needs: []
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}"
  tags:
    - nccl-eos
  script:
    - ./test/scripts/gitlab-runner-fairshare.sh

fairshare-cw-dfw:
  stage: setup
  rules:
    # - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_CW_DFW == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1"))
    #   when: always
    - when: never
  needs: []
  variables:
    CI_BUILDS_DIR: "${CW_DFW_CI_BUILDS_DIR}"
  tags:
    - nccl-cw-dfw
  script:
    - ./test/scripts/gitlab-runner-fairshare.sh

fairshare-draco-oci:
  stage: setup
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_DRACO_OCI == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1"))
      when: always
    - when: never
  needs: []
  tags:
    - draco-oci-iad
  script:
    - ./test/scripts/gitlab-runner-fairshare.sh

setup-AWS_H100_EFA:
  stage: setup
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_AWS == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1"))
      when: always
    - when: never
  tags:
    - ipp6-nccl
  needs:
    - job: build-ipp6
  variables:
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
  script:
    - set -e
    - rsync -I -c -aP --inplace --exclude ./.git ./ $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/

setup-pre-nyx:
  stage: setup
  extends:
    - .pre-nyx
    - .setup
  rules:
    - !reference [.pre_submit, rules]
    - !reference [.pre-nyx, rules]
  needs: ["build-ipp6"]
  variables:
    BUILD_DIR: "build"
    INSTALL_DIR: "${PRE_NYX_INSTALL_DIR}"
    CI_BUILDS_DIR: "${PRE_NYX_CI_BUILDS_DIR}"

setup-pre-tyche:
