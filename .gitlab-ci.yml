stages:
  - build
  - unit_tests
  - api_tests
  - perf_tests_single
  - perf_tests_multi

build:
  stage: build
  tags:
    - build
  variables:
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-11.0"
  script:
    - make -j test.build MPI=1 MPI_HOME=$MPI_HOME CUDA_HOME=$CUDA_HOME
  artifacts:
    paths:
      - build
    expire_in: 1 day
  interruptible: true

unit_tests:
  stage: unit_tests
  tags:
    - build
  variables:
    CUDA_HOME: "/usr/local/cuda-11.0"
  script:
    - (cd build/test/unit; LD_LIBRARY_PATH=$PWD/../../lib:$CUDA_HOME/lib64 ./graph_test)
  interruptible: true

apitest-P100:
  stage: api_tests
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    CUDA_HOME: "/usr/local/cuda-11.0"
    SRUN: "srun -t 00:05:00 -n 1 -c 8 -pP100"
  script:
    - ./test/scripts/gitlab-runner-apitest.sh
  interruptible: true

