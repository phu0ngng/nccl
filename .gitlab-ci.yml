##
## Stage: comprehensive_sweep - Start...
## Comprehensive performance sweeps across node scales
## Templates defined in .gitlab-template.yml
##
## COMPREHENSIVE_SWEEP variable controls which jobs run:
##   - "off": No comprehensive sweep jobs run
##   - "debug": Only debug jobs run (1-node intra + 2-node inter per cluster)
##   - "full": All jobs run (debug + full scale matrices)
##

#############################################
# DEBUG Jobs - Run on "debug" or "full" mode
# 1-node intra + 2-node inter per cluster
#############################################

# EOS Debug Jobs
cs-eos-intra-debug:
  extends:
    - .eos
    - .comprehensive-sweep
  rules:
    - if: $COMPREHENSIVE_SWEEP == "debug" && $RUN_ON_EOS == "1"
      when: always
    - when: never
  needs:
    - setup-eos
  variables:
    TESTSUITE_TOML: "test/scripts/ci/gcperf-tools/testsuites/comprehensive-intra-nvld-dgx.toml"
    SLURM_TIME: 90
    NNODES: 1

cs-eos-inter-debug:
  extends:
    - .eos
    - .comprehensive-sweep
  rules:
    - if: $COMPREHENSIVE_SWEEP == "debug" && $RUN_ON_EOS == "1"
      when: always
    - when: never
  needs:
    - setup-eos
  variables:
    TESTSUITE_TOML: "test/scripts/ci/gcperf-tools/testsuites/comprehensive-inter-nvld-dgx.toml"
    SLURM_TIME: 90
    NNODES: 2

# CW-DFW Debug Jobs
cs-cw-dfw-intra-debug:
  extends:
    - .cw-dfw
    - .comprehensive-sweep
  rules:
    # - if: $COMPREHENSIVE_SWEEP == "debug" && $RUN_ON_CW_DFW == "1"
    #   when: always
    - when: never
  needs:
    - setup-cw-dfw
  variables:
    TESTSUITE_TOML: "test/scripts/ci/gcperf-tools/testsuites/comprehensive-intra-nvld-dgx.toml"
    SLURM_TIME: 90
    NNODES: 1

cs-cw-dfw-inter-debug:
  extends:
    - .cw-dfw
    - .comprehensive-sweep
  rules:
    # - if: $COMPREHENSIVE_SWEEP == "debug" && $RUN_ON_CW_DFW == "1"
    #   when: always
    - when: never
  needs:
    - setup-cw-dfw
  variables:
    TESTSUITE_TOML: "test/scripts/ci/gcperf-tools/testsuites/comprehensive-inter-nvld-dgx.toml"
    SLURM_TIME: 90
    NNODES: 2

