stages:
  - build
  - setup
  - health
  - unit_tests
  - api_tests
  - perf_tests_single
  - perf_tests_multi
  - profiler_tests
  - replay_tests
  - summary

variables:
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  BUILD_TRACE: "0"
  RUN_ON_AWS: "1"
  RUN_ON_EOS: "1"
  RUN_ON_DRACO_OCI: "1"
  RUN_ON_PRE_NYX: "1"
  RUN_ON_PRE_TYCHE: "1"
  RUN_ON_A100: "1"
  RUN_ON_P100: "1"
  RUN_ON_A40: "1"
  RUN_ON_P40: "1"
  RUN_ON_GP100: "1"
  RUN_UNIT_TESTS: "1"
  RUN_PROFILER_TESTS: "1"
  RUN_API_TESTS: "1"
  RUN_PERF_TESTS_SINGLE: "1"
  RUN_PERF_TESTS_MULTIPLE: "1"
  PLANNED_RESERVED: "Reserved"
  RUN_DLFW_TESTS: "1"
  RUN_ON_IPP6: "1"
  TRIGGER_PIPELINE: "default"

default:
  # set all jobs to interruptible by default
  interruptible: true

# Run our CI on:
# - Every commit to master
# - Every commit to a merge request
# - Schedules (nightlies and weeklies)
# - Merge requests without "Draft:" in the title
workflow:
  # when cancelling a redundant pipeline, cancel all jobs that are interruptible
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $TRIGGER_PIPELINE == "default"
    - if: $CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && ($CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'schedule' || $CI_PIPELINE_SOURCE == 'web' || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH)

##
## Stage: build - Start...
##

# verify that setting TRACE=1 does not break compile
# this is a special build-time setting to increase log verbosity
build-trace:
  stage: build
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && ($BUILD_TRACE == "1" || $CI_PIPELINE_SOURCE == 'schedule')
      when: always
    - when: never
  tags:
    - ipp6-nccl
  variables:
    NCCL_BUILD_TRACE: 1
  script:
    - docker/make.sh ipp6-slurm

build-classic:
  stage: build
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && ($RUN_ON_A100 == "1" || $RUN_ON_A40 == "1" || $RUN_ON_P100 == "1" || $RUN_ON_P40 == "1" || $RUN_ON_GP100 == "1")
      when: always
    - when: never
  tags:
    - build-with-docker
  script:
    - docker/make.sh gc-classic
    - mv build build-gc
  artifacts:
    paths:
      - build-gc
    exclude:
      - build-gc/**/*.o
    expire_in: 48 hrs

build-ipp6:
  stage: build
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && ($RUN_ON_IPP6 == "1" || $RUN_ON_EOS == "1" || $RUN_ON_AWS == "1" || $RUN_ON_DRACO_OCI == "1" || $RUN_ON_PRE_NYX == "1") && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1")
      when: always
    - when: never
  tags:
    - ipp6-nccl
  script:
    - docker/make.sh --ci-build ipp6-slurm,draco-oci,eos,pre-nyx
    - tar -cf - build | pigz --fast > build-ipp6.tar.gz
  artifacts:
    paths:
      - build-ipp6.tar.gz
    expire_in: 48 hrs
  cache:
    key: "$CI_COMMIT_SHORT_SHA"
    paths:
      - build
    policy: push

build-pre-tyche:
  stage: build
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && $RUN_ON_PRE_TYCHE == "1"
      when: always
    - when: never
  tags:
    - ptyche
  variables:
    CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  script:
    - docker/make.sh pre-tyche
    - mv build build-pre-tyche
  artifacts:
    paths:
      - build-pre-tyche
    exclude:
      - build-pre-tyche/**/*.o
    expire_in: 48 hrs

build-dlfw-pytorch-container:
  stage: build
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && $RUN_DLFW_TESTS == "1" && $CI_PIPELINE_SOURCE != 'merge_request_event'
      when: always
    - when: never
  tags:
    - build-with-docker
  variables:
    CONTAINER: gitlab-master.nvidia.com/dl/dgx/pytorch:main-py3-devel
  script:
    - chmod +x test/scripts/dlfw/*.sh
    - ./test/scripts/dlfw/host_login_cr.sh
    - ./test/scripts/dlfw/host_build_nccl_pytorch.sh
  artifacts:
    paths:
      - build-dlfw
    expire_in: 48 hrs
  allow_failure: false

##
## Stage: build - Finish!
##

##
## Stage: setup - Start...
##

