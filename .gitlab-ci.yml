##

##
## Stage: unit_tests - Start...
##

unit-tests-P100:
  stage: unit_tests
  extends:
    - .gc-p100
  rules:
    - <<: *nightly_rule
    - if: $RUN_ON_P100 == "1" && $RUN_UNIT_TESTS == "1"
      when: always
    - when: never
  needs: ["build-ipp6","health-P100"]
  variables:
    NCCL_DEBUG: "WARN"
    SLURM_TIME: 10
    NNODES: 1
    NP: 1
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 1
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    MULTI_SEGMENT_REG_TESTS: 0
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
    REGISTER_MIX_A2A_AR_TESTS: 1
    DEVICE_ID_TESTS: 1
    AFFINITY_RESTORE_TESTS: 1
    LAZY_INIT_TESTS: 1
    HASHTABLE_TESTS: 1
    DEVAPI_WINDOW_STRESS_TESTS: 1
    LSA_POINTER_TESTS: 1
    LSA_MULTIMEM_POINTER_TESTS: 0 # Node lacks NVLS support.
    DYN_MEM_TESTS: 1
    PARAM_TESTS: 1
  script:
    - ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

unit-tests-P40:
  stage: unit_tests
  extends:
    - .gc-p40
  rules:
    - <<: *nightly_rule
    - if: $RUN_ON_P40 == "1" && $RUN_UNIT_TESTS == "1"
      when: always
    - when: never
  needs: ["build-ipp6","health-P40"]
  variables:
    NCCL_DEBUG: "WARN"
    SLURM_TIME: 10
    NNODES: 1
    NP: 1
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 1
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    MULTI_SEGMENT_REG_TESTS: 0
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
