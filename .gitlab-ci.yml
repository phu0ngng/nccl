    - !reference [.eos, rules]
  needs: ["build-ipp6"]
  variables:
    BUILD_DIR: "build"
    INSTALL_DIR: "${EOS_INSTALL_DIR}"
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}"

setup-cw-dfw:
  stage: setup
  extends:
    - .cw-dfw
    - .setup
  rules:
    # - !reference [.pre_submit, rules]
    # - !reference [.cw-dfw, rules]
    - when: never
  needs: ["build-ipp6"]
  variables:
    BUILD_DIR: "build"
    INSTALL_DIR: "${CW_DFW_INSTALL_DIR}"
    CI_BUILDS_DIR: "${CW_DFW_CI_BUILDS_DIR}"

setup-draco-oci:
  stage: setup
  extends:
    - .draco-oci
    - .setup
  rules:
    - !reference [.pre_submit, rules]
    - !reference [.draco-oci, rules]
  needs: ["build-ipp6"]
  variables:
    BUILD_DIR: "build"
    INSTALL_DIR: "${DRACO_OCI_INSTALL_DIR}"

##
## Stage: setup - Finish!
##

##
## Stage: health - Start...
##

health-P100:
  stage: health
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_P100 == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1" || $RUN_REPLAY_TESTS == "1"))
      when: always
    - when: never
  needs: []
  tags:
    - p100
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pP100 ./test/scripts/gitlab-runner-health-check.sh

health-P40:
  stage: health
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_P40 == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1"))
      when: always
    - when: never
  needs: []
  tags:
    - p40
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pP40 ./test/scripts/gitlab-runner-health-check.sh

health-GP100:
  stage: health
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_GP100 == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1"))
      when: always
    - when: never
  needs: []
  tags:
    - gp100
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pGP100 ./test/scripts/gitlab-runner-health-check.sh

##
## Stage: health - Finish!
##

##
## Stage: unit_tests - Start...
##

unit_tests-P100:
  stage: unit_tests
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_P100 == "1" && $RUN_UNIT_TESTS == "1")
      when: always
    - when: never
  needs: ["build-ipp6","health-P100"]
  tags:
    - p100
  variables:
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/clusters/gc-classic-config.sh"
    SLURM_TIME: 10
    SLURM_PARTITION: "P100"
    NNODES: 1
    NGPUS: 8
    NP: 1
    NCCL_HOME: build
    RUN_MODE: "SALLOC_MPI"
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 1
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    MULTI_SEGMENT_REG_TESTS: 0
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
    REGISTER_MIX_A2A_AR_TESTS: 1
    DEVICE_ID_TESTS: 1
    HASHTABLE_TESTS: 1
    DEVAPI_WINDOW_STRESS_TESTS: 1
    LSA_POINTER_TESTS: 1
    LSA_MULTIMEM_POINTER_TESTS: 0 # Node lacks NVLS support.
  script:
    - ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

unit_tests-P40:
  stage: unit_tests
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_P40 == "1" && $RUN_UNIT_TESTS == "1")
      when: always
    - when: never
  needs: ["build-ipp6","health-P40"]
  tags:
    - p40
  variables:
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/clusters/gc-classic-config.sh"
    SLURM_TIME: 10
    SLURM_PARTITION: "P40"
    NNODES: 1
    NGPUS: 8
    NP: 1
    NCCL_HOME: build
    RUN_MODE: "SALLOC_MPI"
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 1
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    MULTI_SEGMENT_REG_TESTS: 0
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
    REGISTER_MIX_A2A_AR_TESTS: 1
    DEVICE_ID_TESTS: 1
    HASHTABLE_TESTS: 1
    DEVAPI_WINDOW_STRESS_TESTS: 1
    LSA_POINTER_TESTS: 1
    LSA_MULTIMEM_POINTER_TESTS: 0 # Node lacks NVLS support.
  script:
    - ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
