stages:
  - build
  - setup
  - downstream
  - health
  - unit_tests
  - api_tests
  - perf_tests_single
  - perf_tests_multi
  - perf_regression
  - comprehensive_sweep
  - profiler_tests
  - inspector_tests
  - replay_tests
  - resiliency_tests
  - cleanup
  - summary

include: .gitlab-template.yml

variables:
  WERROR: 0
  CHECK_SYMBOLS: "0"  # nvbug 5479096. Only runs on ipp6
  FF_TIMESTAMPS: true
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  PLANNED_RESERVED: "Reserved"
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  GIT_STRATEGY: clone
  ##
  # Default pipeline flow to be triggered
  TRIGGER_PIPELINE: "pre-submit"
  ##
  # Force toggle variables
  # Set to '1' to force trigger jobs associated with the variable
  # By default, they will be set to 0 and jobs will be triggered based on the TRIGGER_PIPELINE variable
  #
  # Toggle variable for build jobs
  BUILD_TRACE: "0"
  BUILD_CMAKE: "0"
  BUILD_DOCS: "0"
  # Toggle variables for clusters
  RUN_ON_AWS: "0"
  RUN_ON_CW_DFW: "0"
  RUN_ON_DRACO_OCI: "0"
  RUN_ON_EOS: "0"
  RUN_ON_IPP6: "0"
  RUN_ON_PRE_NYX: "0"
  RUN_ON_PRE_TYCHE: "0"
  RUN_ON_THEIA: "0"
  RUN_ON_BIA: "0"
  RUN_ON_POLYPHE: "0"
  # Polyphe NVL576 cross-clique CI (see test/scripts/ci/README-polyphe-nvl576-ci.md)
  RUN_POLYPHE_NVL576_CI: "0"
  RUN_POLYPHE_NVL576_MEGA: "0"
  POLYPHE_NVL576_MULTI_NVLD_WEEKLY: "0"
  POLYPHE_NVL576_SCALE_ON_NIGHTLY: "0"
  RUN_ON_WINDOWS: "0"
  # Toggle variables for GC nodes
  RUN_ON_A100: "0"
  RUN_ON_P100: "0"
  RUN_ON_A40: "0"
  RUN_ON_P40: "0"
  RUN_ON_GP100: "0"
  # Toggle variables by test type
  RUN_UNIT_TESTS: "0"
  RUN_API_TESTS: "0"
  RUN_PERF_TESTS_SINGLE: "0"
  RUN_PERF_TESTS_MULTIPLE: "0"
  RUN_RESILIENCY_TESTS: "0"
  RUN_DLFW_TESTS: "0"
  RUN_PROFILER_TESTS: "0"
  RUN_INSPECTOR_TESTS: "0"
  RUN_PERF_REGRESSION: "0"
  RUN_NCCL4PY_CI: "0"
  RUN_DDP_TEST: "0"
  # By default skip certain tests
  SKIP_MULTI_RANK_GPU: "1"

default:
  # set all jobs to interruptible by default
  interruptible: true

##
# CI Control flow - The following rules dictate when CI should run and which specific flow should it use.
#
# The 3 specific flows are controlled using the `TRIGGER_PIPELINE` pipeline variable:
# - 'pre-submit': Run this for the 'express' experience, intended to provide a quick validation for the commit. This is the default flow.
# - 'post-submit': Run this for a more comprehensive validation including pre-submit validation.
# - 'nightly': Run this to kick off an exhaustive validation including the post-submit validation.
#
# Overview of rules:
# - For any cases that are not explicitly defined within any conditions, the pipeline will not trigger at all.
# - Run the default pre-submit flow on pipelines triggered commits that are part of open MRs (not marked as 'Draft').
# - Run the post-submit flow on pipelines triggered by commits made to designated branches: master, next, stable, release branch (controlled via `NCCL_RELEASE_BRANCH` pipeline variable).
# - Run the nightly flow on scheduled pipelines.
# - For pipelines triggered via the web UI, run the default pre-submit flow. However, by not modifying `TRIGGER_PIPELINE`, any flow can be triggered via the override mechanism.
# - Auto-cancel via new commits is disabled on pipelines on triggered by commits on designated branches and scheduled pipelines.
##
workflow:
  # Disable auto cancel for redundant pipelines by default
  auto_cancel:
    on_new_commit: none
  rules:
    # Enable pipeline trigger upon commits made to open MRs, via web UI or via an API call. Run the default pre-submit flow unless TRIGGER_PIPELINE is overridden explicitly.
    - if: ($CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && $CI_PIPELINE_SOURCE == 'merge_request_event') || $CI_PIPELINE_SOURCE == 'web' || $CI_PIPELINE_SOURCE == 'api'
      # Enable auto cancel for redundant pipelines, cancel all jobs that are interruptible
      auto_cancel:
        on_new_commit: interruptible
    # Enable pipeline trigger on commits made to designated branches and disable auto-cancel via new commits. Run the post-submit phase. However, do all this only when it's not a scheduled pipeline as we have a separate condition for those.
    - if: ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH) && $CI_PIPELINE_SOURCE != 'schedule'
      variables:
        TRIGGER_PIPELINE: "post-submit"
    # Enable pipeline trigger via shcedules, and kick off the nightly flow.
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      variables:
        TRIGGER_PIPELINE: "nightly"
    - when: never

# YAML Anchors for trigger pipeline rules
.pre_submit_rule: &pre_submit_rule
  if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/
  when: always
.post_submit_rule: &post_submit_rule
  if: $TRIGGER_PIPELINE =~ /^(post-submit|nightly|weekly)$/
  when: always
.nightly_rule: &nightly_rule
  if: $TRIGGER_PIPELINE =~ /^(nightly|weekly)$/
  when: always
.weekly_rule: &weekly_rule
  if: $TRIGGER_PIPELINE =~ /^(weekly)$/
  when: always
.comprehensive_sweep_debug_rule: &comprehensive_sweep_debug_rule
  if: $COMPREHENSIVE_SWEEP == "debug"
  when: always
.comprehensive_sweep_full_rule: &comprehensive_sweep_full_rule
  if: $COMPREHENSIVE_SWEEP == "debug" || $COMPREHENSIVE_SWEEP == "full"
  when: always

# YAML anchor for public paths
# This needs to be defined separately from PUBLIC_PATHS.txt as there's
# no way for GitLab to read in the file list to use as a rule
.public_paths: &public_paths
  - ".github/**/*"
  - "bindings/ir/**/*"
  - "bindings/nccl4py/**/*"
  - "cmake/NCCLConfig.cmake.in"
  - "contrib/nccl_ep/**/*"
  - "docs/examples/**/*"
  - "makefiles/**/*"
  - "pkg/**/*"
  - "plugins/env/example/**/*"
  - "plugins/env/README.md"
  - "plugins/mixed/example/**/*"
  - "plugins/mixed/README.md"
  - "plugins/net/CMakeLists.txt"
  - "plugins/net/example/**/*"
  - "plugins/net/google-fastsocket/**/*"
  - "plugins/net/README.md"
  - "plugins/profiler/**/*"
  - "plugins/tuner/**/*"
  - "src/**/*"
  - ".gitignore"
  - "CMakeLists.txt"
  - "CONTRIBUTING.md"
  - "LICENSE.txt"
  - "Makefile"
  - "README.md"
  - "ThirdPartyNotices.txt"
  - "!**/internal/**/*"
  - "!**/*-internal/**/*"
  - "!**/.gitlab-ci.yml"
  - "!bindings/nccl4py/build_assets/**/*"
  - "!bindings/nccl4py/ci/**/*"
  - "!bindings/nccl4py/tests/**/*"
  - "!pkg/conda/**/*"
  - "!pkg/doc/**/*"

##
## Stage: build - Start...
##

# verify that setting TRACE=1 does not break compile
# this is a special build-time setting to increase log verbosity
build-trace:
  stage: build
  extends:
    - .ipp6
  rules:
    - <<: *nightly_rule
    - if: $BUILD_TRACE == "1"
      when: always
    - when: never
  variables:
    NCCL_BUILD_TRACE: 1
  script:
    - docker/make.sh ipp6-slurm

build-ipp6:
  stage: build
  extends:
    - .ipp6
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_IPP6 == "1"
      when: always
    - if: $RUN_ON_DRACO_OCI == "1" || $RUN_ON_EOS == "1" || $RUN_ON_CW_DFW == "1" || $RUN_ON_PRE_NYX == "1" || $RUN_ON_AWS == "1"
      when: always
    - if: $RUN_ON_P100 == "1" || $RUN_ON_A100 == "1" || $RUN_ON_A40 == "1" || $RUN_ON_P40 == "1" || $RUN_ON_GP100 == "1"
      when: always
    - when: never
  script:
    - docker/make.sh --ci-build --use-build-cluster-image ipp6-slurm,draco-oci,eos,cw-dfw,pre-nyx,gc-classic
  retry: 2
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 48 hrs

build-docs:
  stage: build
  extends:
    - .ipp6
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/ || $BUILD_DOCS == "1"
      when: always
    - when: never
  variables:
    NVIDIA_VISIBLE_DEVICES: void
  script:
    - source docker/clusters/ipp6-slurm-config.sh
    - eval "$(get_docs_build_command $(realpath .) $(get_build_image_version))"
  artifacts:
    paths:
      - build/pkg/doc/*.zip
    expire_in: 48 hrs

build-dgxspark:
  stage: build
  extends:
    - .dgxspark
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_DGXSPARK == "1"
      when: always
  variables:
    INSTALL_DIR: $DGXSPARK_INSTALL_DIR
    BUILD_DIR: build
    CLUSTER_CONFIG: "docker/clusters/ipp6-dgxspark-config.sh"
    NVCC_GENCODE: "-gencode=arch=compute_121,code=sm_121"
  script:
    - source $CLUSTER_CONFIG
    - eval "$(get_build_command_bm)"
  retry: 2
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 48 hrs

build-pre-tyche:
  stage: build
  extends:
    - .pre-tyche
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_PRE_TYCHE == "1"
      when: always
    - when: never
  script:
    - docker/make.sh pre-tyche
    - mv build build-pre-tyche
  artifacts:
    paths:
      - build-pre-tyche
    exclude:
      - build-pre-tyche/**/*.o
    expire_in: 48 hrs

build-theia:
  stage: build
  extends:
    - .theia
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_THEIA == "1"
      when: always
    - when: never
  script:
    - docker/make.sh theia --baremetal-build
    - mv build build-theia
  artifacts:
    paths:
      - build-theia
    exclude:
      - build-theia/**/*.o
    expire_in: 48 hrs

build-bia:
  stage: build
  extends:
    - .bia
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_BIA == "1"
      when: always
    - when: never
  script:
    - docker/make.sh bia
    - mv build build-bia
  artifacts:
    paths:
      - build-bia
    exclude:
      - build-bia/**/*.o
    expire_in: 48 hrs

build-polyphe:
  stage: build
  extends:
    - .polyphe
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_POLYPHE == "1"
      when: always
    - when: never
  script:
    - docker/make.sh polyphe
    - mv build build-polyphe
  artifacts:
    paths:
      - build-polyphe
    exclude:
      - build-polyphe/**/*.o
    expire_in: 48 hrs

build-dlfw-pytorch-container:
  stage: build
  extends:
    - .ipp6
  rules:
    - <<: *nightly_rule
    - if: $RUN_ON_EOS == "1" && $RUN_DLFW_TESTS == "1"
      when: always
    - when: never
  variables:
    CONTAINER: gitlab-master.nvidia.com/dl/dgx/pytorch:main-py3-devel
  script:
    - chmod +x test/scripts/dlfw/*.sh
    - ./test/scripts/dlfw/host_login_cr.sh
    - ./test/scripts/dlfw/host_build_nccl_pytorch.sh
  artifacts:
    paths:
      - build-dlfw
    expire_in: 48 hrs
  allow_failure: false

build-cmake:
  stage: build
  extends:
    - .ipp6
  rules:
    - <<: *pre_submit_rule
    - if: $BUILD_CMAKE == "1"
      when: always
    - when: never
  variables:
    SLURM_PARTITION: cpuonly
    SLURM_TIME: 15
  retry: 2
  script:
    # TODO (kartiki) - Invoke this via docker/make.sh
    - srun --exclusive -p $SLURM_PARTITION -N 1 -t $SLURM_TIME docker/build_nccl_bm_cmake.sh --ci-build --enable-ccache
  allow_failure: false

build-windows:
  stage: build
  extends:
    - .windows
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_WINDOWS == "1"
      when: always
    - when: never
  script:
    - cmake -DCMAKE_CUDA_ARCHITECTURES=90 -DBUILD_TESTS=ON -B build
    - cmake --build build --parallel
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 48 hrs

