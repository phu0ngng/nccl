unit_tests-P100:
  stage: unit_tests
  rules:
    - when: always
  needs: ["build-classic","health-P100"]
  tags:
    - p100
  variables:
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/gc-classic-config.sh"
    SLURM_TIME: 10
    SLURM_PARTITION: "P100"
    NNODES: 1
    NGPUS: 8
    NP: 1
    NCCL_HOME: build-gc
    RUN_MODE: "SALLOC_MPI"
  script:
    - ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

