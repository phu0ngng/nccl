perftest-multi-DGX-1V:
  stage: perf_tests_multi
  rules:
    - when: always
  rules:
    - if: $RUN_ON_DRACO == "1"
      when: always
    - when: never
  needs: [build-eos-aws-oci]
  tags:
    - dgx-1v
  variables:
    MPI_HOME: "/home/svc_nvshmem_ci/mpi/openmpi-1.10.7"
