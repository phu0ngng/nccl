variables:
  WERROR: 0
  CHECK_SYMBOLS: "0"  # nvbug 5479096. Only runs on ipp6
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  PLANNED_RESERVED: "Reserved"
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  GIT_STRATEGY: clone
  ##
  # Default pipeline flow to be triggered
  TRIGGER_PIPELINE: "pre-submit"
  ##
  # Force toggle variables
  # Set to '1' to force trigger jobs associated with the variable
  # By default, they will be set to 0 and jobs will be triggered based on the TRIGGER_PIPELINE variable
  #
  # Toggle variable for build jobs
  BUILD_TRACE: "0"
  BUILD_CMAKE: "0"
  # Toggle variables for clusters
  RUN_ON_AWS: "0"
  RUN_ON_CW_DFW: "0"
  RUN_ON_DRACO_OCI: "0"
  RUN_ON_EOS: "0"
  RUN_ON_IPP6: "0"
  RUN_ON_PRE_NYX: "0"
  RUN_ON_PRE_TYCHE: "0"
  RUN_ON_THEIA: "0"
  RUN_ON_BIA: "0"
  # Toggle variables for GC nodes
  RUN_ON_A100: "0"
  RUN_ON_P100: "0"
  RUN_ON_A40: "0"
  RUN_ON_P40: "0"
  RUN_ON_GP100: "0"
  # Toggle variables by test type
  RUN_UNIT_TESTS: "0"
  RUN_API_TESTS: "0"
  RUN_PERF_TESTS_SINGLE: "0"
  RUN_PERF_TESTS_MULTIPLE: "0"
  RUN_DLFW_TESTS: "0"
  RUN_PROFILER_TESTS: "0"
  RUN_INSPECTOR_TESTS: "0"
  RUN_REPLAY_TESTS: "0"
  RUN_PERF_REGRESSION: "0"
  RUN_NCCL4PY_CI: "0"
  ##
  # Cluster-specific paths
  # Used by setup and test jobs to install/reference build artifacts
  #
  # EOS cluster
  EOS_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  EOS_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  EOS_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # CW-DFW cluster
  CW_DFW_INSTALL_DIR: "/lustre/fsw/portfolios/coreai/users/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  CW_DFW_CI_BUILDS_DIR: "/lustre/fsw/portfolios/coreai/users/$GITLAB_USER_LOGIN/gitlab-runner"
  CW_DFW_ARCHIVER_STAGING_DIR: "/lustre/fsw/portfolios/coreai/users/$GITLAB_USER_LOGIN/gitlab-runner"
  # DRACO-OCI cluster
  DRACO_OCI_INSTALL_DIR: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}"
  # PRE-NYX cluster
  PRE_NYX_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  PRE_NYX_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  PRE_NYX_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # PRE-TYCHE cluster
  PRE_TYCHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  PRE_TYCHE_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  PRE_TYCHE_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # THEIA cluster
  THEIA_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  THEIA_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  THEIA_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  # BIA cluster
  BIA_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner/install/${CI_PIPELINE_ID}"
  BIA_CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  BIA_ARCHIVER_STAGING_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"

default:
  # set all jobs to interruptible by default
  interruptible: true

##
# CI Control flow - The following rules dictate when CI should run and which specific flow should it use.
#
# The 3 specific flows are controlled using the `TRIGGER_PIPELINE` pipeline variable:
# - 'pre-submit': Run this for the 'express' experience, intended to provide a quick validation for the commit. This is the default flow.
# - 'post-submit': Run this for a more comprehensive validation including pre-submit validation.
# - 'nightly': Run this to kick off an exhaustive validation including the post-submit validation.
#
# Overview of rules:
# - For any cases that are not explicitly defined within any conditions, the pipeline will not trigger at all.
# - Run the default pre-submit flow on pipelines triggered commits that are part of open MRs (not marked as 'Draft').
# - Run the post-submit flow on pipelines triggered by commits made to designated branches: master, next, stable, release branch (controlled via `NCCL_RELEASE_BRANCH` pipeline variable).
# - Run the nightly flow on scheduled pipelines.
# - For pipelines triggered via the web UI, run the default pre-submit flow. However, by not modifying `TRIGGER_PIPELINE`, any flow can be triggered via the override mechanism.
# - Auto-cancel via new commits is disabled on pipelines on triggered by commits on designated branches and scheduled pipelines.
##
workflow:
  # Disable auto cancel for redundant pipelines by default
  auto_cancel:
    on_new_commit: none
  rules:
    # Enable pipeline trigger upon commits made to open MRs, via web UI or via an API call. Run the default pre-submit flow unless TRIGGER_PIPELINE is overridden explicitly.
    - if: ($CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && $CI_PIPELINE_SOURCE == 'merge_request_event') || $CI_PIPELINE_SOURCE == 'web' || $CI_PIPELINE_SOURCE == 'api'
      # Enable auto cancel for redundant pipelines, cancel all jobs that are interruptible
      auto_cancel:
        on_new_commit: interruptible
    # Enable pipeline trigger on commits made to designated branches and disable auto-cancel via new commits. Run the post-submit phase. However, do all this only when it's not a scheduled pipeline as we have a separate condition for those.
    - if: ($CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH) && $CI_PIPELINE_SOURCE != 'schedule'
      variables:
        TRIGGER_PIPELINE: "post-submit"
    # Enable pipeline trigger via shcedules, and kick off the nightly flow.
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      variables:
        TRIGGER_PIPELINE: "nightly"
    - when: never

include: .gitlab-template.yml

##
## Stage: build - Start...
##

# verify that setting TRACE=1 does not break compile
# this is a special build-time setting to increase log verbosity
build-trace:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || $BUILD_TRACE == "1"
      when: always
    - when: never
  tags:
    - ipp6-nccl
  variables:
    NCCL_BUILD_TRACE: 1
  script:
    - docker/make.sh ipp6-slurm

build-ipp6:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/ || (($RUN_ON_IPP6 == "1" || $RUN_ON_EOS == "1" || $RUN_ON_AWS == "1" || $RUN_ON_DRACO_OCI == "1" || $RUN_ON_PRE_NYX == "1" || $RUN_ON_CW_DFW == "1") && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1" || $RUN_PERF_REGRESSION == "1" || $RUN_NCCL4PY_CI == "1"))
      when: always
    - when: never
  tags:
    - ipp6-nccl
  script:
    - docker/make.sh --ci-build --use-build-cluster-image ipp6-slurm,draco-oci,eos,cw-dfw,pre-nyx,gc-classic
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 48 hrs

build-pre-tyche:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/ || ($RUN_ON_PRE_TYCHE == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1" || $RUN_PERF_REGRESSION == "1"))
      when: always
    - when: never
  tags:
    - ptyche
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}"
  script:
    - docker/make.sh pre-tyche
    - mv build build-pre-tyche
  artifacts:
    paths:
      - build-pre-tyche
    exclude:
      - build-pre-tyche/**/*.o
    expire_in: 48 hrs

build-theia:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly|weekly)$/ || ($RUN_ON_THEIA == "1" && ($RUN_UNIT_TESTS == "1" || $RUN_API_TESTS == "1" || $RUN_PERF_TESTS_SINGLE == "1" || $RUN_PERF_TESTS_MULTIPLE == "1" || $RUN_PERF_REGRESSION == "1"))
      when: always
    - when: never
  tags:
    - lyris
  variables:
    CI_BUILDS_DIR: "${THEIA_CI_BUILDS_DIR}"
  script:
    - docker/make.sh theia --baremetal-build
    - mv build build-theia
  artifacts:
    paths:
      - build-theia
    exclude:
      - build-theia/**/*.o
    expire_in: 48 hrs

build-bia:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_BIA == "1")
      when: always
    - when: never
  tags:
    - bia
  variables:
    CI_BUILDS_DIR: "${BIA_CI_BUILDS_DIR}"
  script:
    - docker/make.sh bia
    - mv build build-bia
  artifacts:
    paths:
      - build-bia
    exclude:
      - build-bia/**/*.o
    expire_in: 48 hrs

build-dlfw-pytorch-container:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_EOS == "1" && $RUN_DLFW_TESTS == "1")
      when: always
    - when: never
  tags:
    - build-with-docker
  variables:
    CONTAINER: gitlab-master.nvidia.com/dl/dgx/pytorch:main-py3-devel
  script:
    - chmod +x test/scripts/dlfw/*.sh
    - ./test/scripts/dlfw/host_login_cr.sh
    - ./test/scripts/dlfw/host_build_nccl_pytorch.sh
  artifacts:
    paths:
      - build-dlfw
    expire_in: 48 hrs
  allow_failure: false

build-cmake:
  stage: build
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || $BUILD_CMAKE == "1"
      when: always
    - when: never
  tags:
    - ipp6-nccl
  variables:
    SLURM_PARTITION: cpuonly
    SLURM_TIME: 15
  script:
    # TODO (kartiki) - Invoke this via docker/make.sh
    - srun --exclusive -p $SLURM_PARTITION -N 1 -t $SLURM_TIME docker/build_nccl_bm_cmake.sh
  allow_failure: false

##
## Stage: build - Finish!
##

##
## Stage: downstream - Start...
##

nccl4py_ci:
  stage: downstream
  needs:
    - build-ipp6
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_IPP6 == "1" && $RUN_NCCL4PY_CI == "1")
      when: always
    - when: never
  trigger:
    include: nccl4py/.gitlab-ci.yml
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

