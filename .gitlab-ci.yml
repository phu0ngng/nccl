multi-perftest-A40:
  stage: perf_tests_multi
  rules:
    - when: always
  needs: ["build-classic"]
  tags:
    - a40
  variables:
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
    NNODES: 2
    NGPUS: 2
    SALLOC: "salloc --exclusive -t 00:10:00 -N ${NNODES} -n ${NGPUS} -pA40"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - ./test/scripts/gitlab-runner-perftest.sh 1G 0
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs

perftest-A100:
  stage: perf_tests_single
  rules:
    - when: always
  needs: ["build-classic"]
  tags:
    - a100pci
  variables:
    NCCL_DEBUG: "WARN"
    NNODES: 1
    NGPUS: 8
    SALLOC: "salloc --exclusive -t 00:10:00 -N ${NNODES} -n ${NGPUS} -pA100"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - ./test/scripts/gitlab-runner-perftest.sh 1G 0
  artifacts:
    when: always
    paths:
