unit_tests-AWS_H100_EFA:
  stage: unit_tests
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_AWS == "1" && $RUN_UNIT_TESTS == "1")
      when: always
    - when: never
  needs:
    - setup-AWS_H100_EFA
  tags:
    - ipp6-nccl-v3
  variables:
    GIT_STRATEGY: none
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
    RUN_SCRIPT: run_${CI_JOB_NAME}.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-unit.sh
    JUNIT: junit_results_unit.xml
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 0
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 0
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
    DEVICE_ID_TESTS: 1
    DEVAPI_WINDOW_STRESS_TESTS: 1
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/clusters/aws-config.sh"
      export SLURM_TIME=15
      export SLURM_PARTITION=compute
      export NNODES=1
      export NGPUS=8
      export NP=1
      export NCCL_HOME=build
      export LD_LIBRARY_PATH=build/lib:$LD_LIBRARY_PATH
      export RUN_MODE="SALLOC_MPI"
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export JUNIT=$JUNIT
      export ENQUEUE_TESTS_ARGS=$ENQUEUE_TESTS_ARGS
      export ENQUEUE_TESTS_FIFO=$ENQUEUE_TESTS_FIFO
      export GRAPH_TESTS_DEFAULT=$GRAPH_TESTS_DEFAULT
      export MEMLEAK_TESTS_DEFAULT=$MEMLEAK_TESTS_DEFAULT
      export MEMLEAK_TESTS_NO_P2P=$MEMLEAK_TESTS_NO_P2P
      export MEMLEAK_TESTS_NETWORK=$MEMLEAK_TESTS_NETWORK
      export FT_TESTS_DEFAULT=$FT_TESTS_DEFAULT
      export FT_TESTS_NO_P2P=$FT_TESTS_NO_P2P
      export FT_TESTS_NETWORK=$FT_TESTS_NETWORK
      export PLUGIN_TESTS_NET_TUNER=$PLUGIN_TESTS_NET_TUNER
      export LOG_ALGO_RS_TESTS=$LOG_ALGO_RS_TESTS
      export LOG_ALGO_AG_TESTS=$LOG_ALGO_AG_TESTS
      export PLUGIN_LOADING_TESTS=$PLUGIN_LOADING_TESTS
      export DEVICE_ID_TESTS=$DEVICE_ID_TESTS
      $TEST_CMD
      EOF
    - rsync -I -c $RUN_SCRIPT $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/
  script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && JUNIT=junit_results_unit.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $AWS_HEAD_NODE_WORKDIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/failed .
    - scp $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/$JUNIT .
    - ls && ls failed && ls $JUNIT
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

