stages:
  - build
  - setup
  - health
  - unit_tests
  - api_tests
  - perf_tests_single
  - perf_tests_multi
  - perf_regression
  - replay_tests

variables:
  RUN_MULTI_REGRESSION: "0" # Set to 1 to run multinode regression pipeline
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  REGRESSION_BASELINE: "v2.15.5-1" # Compare to stable branch (Update git tag as necessary)
  REGRESSION_THRESHOLD: 7 # What percent difference should we use to compare?
  REGRESSION_ITERATIONS: 5 # How many iterations should we run latency and overhead tests?
  REGRESSION_CHECK_CPU_OVERHEAD: 0 # Should we run CPU overhead tests in the perf regression?
  MULTI_REGRESSION_SALLOC_TIME: 45 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  SINGLE_REGRESSION_SALLOC_TIME: 30 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  SHARP_MULTI_JOB_TIME:  10
  RUN_ON_SELENE_SHARP: "0"
  BUILD_TRACE: "0"
  RUN_ON_AWS: "1"
  RUN_ON_EOS: "1"
  RUN_ON_DRACO_OCI: "1"
  RUN_UNIT_API_TESTS_ON_DRACO_OCI: "0" # TODO (kartiki/bewilliams) - Enable after addressing https://nvbugspro.nvidia.com/bug/4861033

default:
  # set all jobs to interruptible by default
  interruptible: true

# Run our CI on:
# - Every commit to master
# - Every commit to a merge request
# - Schedules (nightlies and weeklies)
# - Merge requests without "Draft:" in the title
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && ($CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'schedule' || $CI_PIPELINE_SOURCE == 'web' || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH)
  # when cancelling a redundant pipeline, cancel all jobs that are interruptible
  auto_cancel:
    on_new_commit: interruptible

build-trace:
  stage: build
  rules:
    - if: $BUILD_TRACE == "1" || $CI_PIPELINE_SOURCE == 'schedule'
      when: always
    - when: never
  tags:
    - build
  variables:
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
  script:
    - echo "Using CUDA_HOME=$CUDA_HOME, MPI_HOME=$MPI_HOME"
    - make -j test.build MPI=1 TRACE=1 MPI_HOME=$MPI_HOME CUDA_HOME=$CUDA_HOME

build-classic:
  stage: build
  tags:
    - build-with-docker
  script:
    - docker/make.sh gc-classic
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 4 hrs

build-eos-aws-oci:
  stage: build
  rules:
    - if: $RUN_ON_EOS == "1" || $RUN_ON_AWS == "1" || $RUN_ON_DRACO_OCI == "1"
      when: always
    - when: never
  tags:
    - build-with-docker
  script:
    # EOS cluster info
    #   NVIDIA-SMI 535.129.03  Driver Version: 535.129.03  CUDA Version: 12.2
    #   NVCC_GENCODE: 90
    #   OS: ubuntu22.04
    #   MPI_HOME: "/usr/mpi/gcc/openmpi-4.1.5rc2"
    # Draco OCI-IAD cluster info
    #   NVIDIA-SMI 535.113.01  Driver Version: 535.104.12  CUDA Version: 12.2
    #   NVCC_GENCODE: 80
    #   OS: ubuntu20.04
    #   MPI_HOME: "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/local/openmpi-4.1.4"
    - docker/make.sh draco-oci,eos
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 4 hrs

fairshare-eos:
  stage: setup
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
    - when: never
  tags:
    - nccl-eos
  script:
    - chmod +x test/scripts/gitlab-runner-fairshare.sh
    - ./test/scripts/gitlab-runner-fairshare.sh

fairshare-draco-oci:
  stage: setup
  rules:
    - if: $RUN_ON_DRACO_OCI == "1"
      when: always
    - when: never
  tags:
    - draco-oci-iad
  script:
    - chmod +x test/scripts/gitlab-runner-fairshare.sh
    - ./test/scripts/gitlab-runner-fairshare.sh

setup-AWS_H100_EFA:
  stage: setup
  rules:
    - if: $RUN_ON_AWS == "1"
      when: always
    - when: never
  tags:
    - aws_p5
  needs:
    # Builds targetted for EOS work on AWS as well as the build config is the same across both clusters.
    # TODO - Refactor build jobs to decouple EOS and AWS.
    - build-eos-aws-oci
  variables:
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
  script:
    - rsync -a --exclude ./.git ./ $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/

health-P100:
  stage: health
  rules:
    - when: always
  needs: []
  tags:
    - p100
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pP100 ./test/scripts/gitlab-runner-health-check.sh

health-P40:
  stage: health
  rules:
    - when: always
  needs: []
  tags:
    - p40
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pP40 ./test/scripts/gitlab-runner-health-check.sh

health-GP100:
  stage: health
  rules:
    - when: always
  needs: []
  tags:
    - gp100
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pGP100 ./test/scripts/gitlab-runner-health-check.sh

health-A40:
  stage: health
  rules:
    - when: always
  needs: []
  tags:
    - a40
  script:
    - srun --exclusive -t 00:02:00 -N 2 -c 2 -pA40 ./test/scripts/gitlab-runner-health-check.sh

health-A100:
  stage: health
  rules:
    - when: always
  needs: []
  tags:
    - a100pci
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pA100 ./test/scripts/gitlab-runner-health-check.sh

unit_tests-P100:
  stage: unit_tests
  rules:
    - when: always
  needs: ["build-classic","health-P100"]
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    SRUN: "srun --exclusive -t 00:10:00 -n 1 -c 8 -pP100"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home)
    - ./test/scripts/gitlab-runner-unit.sh
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs

