unit-tests-AWS-H100-EFA:
  stage: unit_tests
  extends:
    - .aws
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_AWS == "1" && $RUN_UNIT_TESTS == "1"
      when: always
  needs:
    - setup-AWS-H100-EFA
  variables:
    GIT_STRATEGY: none
    TEST_WORKSPACE_DIR: ${WORKSPACE_DIR}/unit
    RUN_SCRIPT: run_tests.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-unit.sh
    JUNIT: junit_results_unit.xml
    SLURM_TIME: 50
    NNODES: 1
    NP: 1
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 0
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 0
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    MULTI_SEGMENT_REG_TESTS: 0 # No DMA-Buf support so we disable these tests (NVBug 6001651)
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
    PLUGIN_LOADING_TESTS: 1
    REGISTER_MEMCPY_TESTS: 1
    REGISTER_MIX_A2A_AR_TESTS: 1
    DEVICE_ID_TESTS: 1
    AFFINITY_RESTORE_TESTS: 1
    LAZY_INIT_TESTS: 1
    HASHTABLE_TESTS: 1
    DEVAPI_WINDOW_STRESS_TESTS: 1
    LSA_POINTER_TESTS: 1
    LSA_MULTIMEM_POINTER_TESTS: 0 # NVLS support is unstable so we disable it.
    DYN_MEM_TESTS: 1
    PARAM_TESTS: 1
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      #!/bin/bash

      # Gitlab passthrough variables
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH}
      export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      export GITLAB_USER_LOGIN=${GITLAB_USER_LOGIN}

      # CI infra variables
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/clusters/aws-config.sh"
      export SLURM_TIME=$SLURM_TIME
      export SLURM_PARTITION=$SLURM_PARTITION
      export NNODES=$NNODES
      export NGPUS=$NGPUS
      export NP=$NP
      export RUN_MODE=${RUN_MODE}
      export NCCL_HOME=${NCCL_HOME}
      export LD_LIBRARY_PATH=${NCCL_HOME}/lib:${LD_LIBRARY_PATH}
      export JUNIT=${JUNIT}

      # Unit test variables
      export NCCL_NVLS_ENABLE=0
      export ENQUEUE_TESTS_ARGS=$ENQUEUE_TESTS_ARGS
      export ENQUEUE_TESTS_FIFO=$ENQUEUE_TESTS_FIFO
      export GRAPH_TESTS_DEFAULT=$GRAPH_TESTS_DEFAULT
      export MEMLEAK_TESTS_DEFAULT=$MEMLEAK_TESTS_DEFAULT
      export MEMLEAK_TESTS_NO_P2P=$MEMLEAK_TESTS_NO_P2P
      export MEMLEAK_TESTS_NETWORK=$MEMLEAK_TESTS_NETWORK
      export FT_TESTS_DEFAULT=$FT_TESTS_DEFAULT
      export FT_TESTS_NO_P2P=$FT_TESTS_NO_P2P
      export FT_TESTS_NETWORK=$FT_TESTS_NETWORK
      export PLUGIN_TESTS_NET_TUNER=$PLUGIN_TESTS_NET_TUNER
      export MULTI_SEGMENT_REG_TESTS=$MULTI_SEGMENT_REG_TESTS
      export LOG_ALGO_RS_TESTS=$LOG_ALGO_RS_TESTS
      export LOG_ALGO_AG_TESTS=$LOG_ALGO_AG_TESTS
      export PLUGIN_LOADING_TESTS=$PLUGIN_LOADING_TESTS
      export REGISTER_MEMCPY_TESTS=$REGISTER_MEMCPY_TESTS
      export REGISTER_MIX_A2A_AR_TESTS=$REGISTER_MIX_A2A_AR_TESTS
      export DEVICE_ID_TESTS=$DEVICE_ID_TESTS
      export AFFINITY_RESTORE_TESTS=$AFFINITY_RESTORE_TESTS
      export LAZY_INIT_TESTS=$LAZY_INIT_TESTS
      export HASHTABLE_TESTS=$HASHTABLE_TESTS
      export DEVAPI_WINDOW_STRESS_TESTS=$DEVAPI_WINDOW_STRESS_TESTS
      export LSA_POINTER_TESTS=$LSA_POINTER_TESTS
      export LSA_MULTIMEM_POINTER_TESTS=$LSA_MULTIMEM_POINTER_TESTS
      export DYN_MEM_TESTS=$DYN_MEM_TESTS
      export PARAM_TESTS=$PARAM_TESTS

      # Launch unit test suite
      salloc -N ${NNODES} --exclusive -J "nccl-ci::${GITLAB_USER_LOGIN}:unit::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME} -p ${SLURM_PARTITION} $TEST_CMD
      EOF
    - rsync $RUN_SCRIPT $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/
  script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && JUNIT=junit_results_unit.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $TEST_WORKSPACE_DIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/failed .
    - scp $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/$JUNIT .
    - ls && ls failed && ls $JUNIT
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

