    - if: ($TRIGGER_PIPELINE == "default") && $RUN_ON_PRE_NYX == "1" && $RUN_PERF_TESTS_MULTIPLE == "1"
      when: always
    - when: never
  needs:
    - build-ipp6
  tags:
    - prenyx
  variables:
    CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/clusters/pre-nyx-config.sh"
    SLURM_TIME: 45
    SLURM_PARTITION: batch
    RUN_MODE: "SRUN_MPI"
    NGPUS: 8
    MAX: "1G"
    NP: 8
    GRAPH: 0
    NCCL_HOME: build
    SLURM_ACCOUNT: coreai_libraries_nccl
    NNODES: $MULTI_PERFTEST_NODE_COUNT
  before_script:
    - tar -xzf build-ipp6.tar.gz
  script:
    - export SALLOC="salloc -N ${NNODES} --exclusive --account=${SLURM_ACCOUNT} -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN}:perftest-multi::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME} -p ${SLURM_PARTITION}"
    - $SALLOC ./test/scripts/ci/gitlab-runner-perf.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

