apitest-DGX-1V:
  stage: api_tests
  rules:
    - if: '$RUN_ON_DRACO == "1"'
      when: always
    - when: never
  tags:
    - nccl-draco
  variables:
    CUDA_HOME: "/home/bewilliams/cuda/cuda/cuda-11.3"
    SRUN: ""
  script:
    # TODO - Gain access to ci_dgx1_m3
    - srun -n 1 --account=sw_gpucomms_nccl --nv-meta ml-model.nccl-perf -p batch_short_dgx1_m3 -t 00:05:00 ./test/scripts/gitlab-runner-apitest.sh
  interruptible: true

