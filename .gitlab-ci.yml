    SALLOC: "" # Needs to be empty for CI runner scripts performing cluster jobs
  script:
    - salloc -N ${NNODES} -n ${NGPUS} --account=coreai_libraries_nccl -pluna -J "coreai_libraries_nccl-cicd::$GITLAB_USER_LOGIN:perftest-single::$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA" -t 00:30:00 ./test/scripts/gitlab-runner-perftest.sh 16G
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs

perftest-single-eos:
  stage: perf_tests_single
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
    - when: never
  needs: ["build-eos-aws-oci"]
  tags:
    - nccl-eos
  variables:
    NCCL_DEBUG: "WARN"
    MPI_PARAMS: "-mca btl tcp,self"
    NNODES: 1
    NGPUS: 8
    SKIP_FT_INIT: 1
    SALLOC: "" # Needs to be empty for CI runner scripts performing cluster jobs
  script:
    - source docker/eos-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home) && SLURM_ACCOUNT=$(get_slurm_account)
    - salloc -N ${NNODES} -n ${NGPUS} --account=$SLURM_ACCOUNT -J "${SLURM_ACCOUNT}-cicd::$GITLAB_USER_LOGIN:perftest-single::$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA" -t 00:20:00 ./test/scripts/gitlab-runner-perftest.sh 16G 0 1

perftest_single-AWS_H100_EFA:
  stage: perf_tests_single
  rules:
    - if: $RUN_ON_AWS == "1"
      when: always
    - when: never
  needs:
    - setup-AWS_H100_EFA
  tags:
    - aws_p5
  variables:
    GIT_STRATEGY: none
    AWS_HEAD_NODE: "aws-pcluster-head"
    AWS_HEAD_NODE_WORKDIR: "/shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}"
    NNODES: 1
    NGPUS: 8
    RUN_SCRIPT: run_${CI_JOB_NAME}.sh
    TEST_CMD: ./test/scripts/gitlab-runner-perftest.sh 1G 0 1
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      source docker/aws-config.sh && configure_aws_test_env

      export MPI_PARAMS="--oversubscribe --mca btl tcp,self --mca btl_tcp_if_exclude lo,docker0 --bind-to none"
      export NNODES=$NNODES
      export NGPUS=$NGPUS
      export SALLOC="salloc --exclusive -t 00:10:00 -N $NNODES -n $NGPUS -p compute"
      export UCX_TLS=tcp

      $TEST_CMD
      EOF
    - rsync $RUN_SCRIPT $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR
  script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && bash -l $RUN_SCRIPT"
  artifacts:
    when: always
    paths:
      - $RUN_SCRIPT
    expire_in: 4 hrs

perftest_single-draco_oci:
  stage: perf_tests_single
  rules:
    - if: $RUN_ON_DRACO_OCI == "1"
      when: always
    - when: never
  needs:
    - build-eos-aws-oci
  tags:
    - draco-oci-iad
  variables:
    MPI_PARAMS: "-mca btl tcp,self"
    NNODES: 1
    NGPUS: 8
    SKIP_FT: 1
    SALLOC: "" # Needs to be empty for CI runner scripts performing cluster jobs
    TEST_CMD: ./test/scripts/gitlab-runner-perftest.sh 16G
    TIMEOUT: "00:20:00" # HH:MM:SS
    IS_DRACO_OCI_IAD: 1
  script:
    - source docker/draco-oci-config.sh && configure_test_env
    - salloc --exclusive --nodes $NNODES --gpus-per-node $NGPUS --ntasks-per-node $NGPUS --account=$SLURM_ACCOUNT -J "$SLURM_ACCOUNT-cicd::${GITLAB_USER_LOGIN}::perftest-single::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t $TIMEOUT $TEST_CMD

perftest-multi-gc:
  stage: perf_tests_multi
  rules:
    - when: always
  needs: [build-classic]
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    NCCL_DEBUG: "WARN"
    NCCL_ALLOC_P2P_NET_LL_BUFFERS: "1" # Add coverage of dedicated P2P LL buffers on constrained rank count
    NNODES: 2
    NGPUS: 8
    SKIP_MULTI_GPU: 1
    SALLOC: "salloc --exclusive -t 00:10:00 -N ${NNODES} --ntasks-per-node=${NGPUS} -w gc[01-02]"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - ./test/scripts/gitlab-runner-perftest.sh 128M 0
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs

