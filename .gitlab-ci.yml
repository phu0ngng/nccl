# Kicks off an independent CI pipeline on QA nodes
# https://gitlab-master.nvidia.com/xiaojingl/comms_lib_auto/-/blob/main/NCCL_CI/ci_perftest.sh?ref_type=heads
QA-team-ci:
  stage: setup
  dependencies: []
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(post-submit|nightly)$/
      when: always
    - when: never
  tags:
    - cqa_host_runner
  script:
    - bash $CI_BUILDS_DIR/CI/ci_perftest.sh

