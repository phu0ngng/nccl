unit_tests-eos:
  stage: unit_tests
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
    - when: never
  needs: ["build-eos-aws-oci"]
  tags:
    - nccl-eos
  variables:
    DISABLE_MEMLEAK: "1" # Enable after addressing https://nvbugspro.nvidia.com/bug/4868411
    SRUN: "" # Needs to be empty for CI runner scripts performing cluster jobs
  script:
    - source docker/eos-config.sh && export CUDA_HOME=$(get_cuda_home) && SLURM_ACCOUNT=$(get_slurm_account)
    - srun --exclusive -n 1 -c8 --account=$SLURM_ACCOUNT -J "${SLURM_ACCOUNT}-cicd::$GITLAB_USER_LOGIN:unit::$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA" -t 00:10:00 ./test/scripts/gitlab-runner-unit.sh

unit_tests-AWS_H100_EFA:
  stage: unit_tests
  rules:
    - if: $RUN_ON_AWS == "1"
      when: always
    - when: never
  needs:
    - setup-AWS_H100_EFA
  tags:
    - aws_p5
  variables:
    GIT_STRATEGY: none
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
    RUN_SCRIPT: run_${CI_JOB_NAME}.sh
    TEST_CMD: ./test/scripts/gitlab-runner-unit.sh
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      source docker/aws-config.sh && configure_aws_test_env

      export SRUN="srun --exclusive -t 00:10:00 -n 1 -G 8 -p compute"

      $TEST_CMD
      EOF
    - rsync $RUN_SCRIPT $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR
  script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && bash -l $RUN_SCRIPT"
  artifacts:
    when: always
    paths:
      - $RUN_SCRIPT
    expire_in: 4 hrs

unit_tests-draco_oci:
  stage: unit_tests
