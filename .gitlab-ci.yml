build-dlfw-pytorch-container:
  stage: build
  rules:
    - if: $RUN_DLFW_TESTS == "1"
      when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'web'
      when: manual
    - when: never
  tags:
    - build-with-docker
  variables:
    CONTAINER: gitlab-master.nvidia.com/dl/dgx/pytorch:main-py3-devel
  script:
    - chmod +x test/scripts/dlfw/*.sh
    - ./test/scripts/dlfw/host_login_cr.sh
    - ./test/scripts/dlfw/host_build_nccl_pytorch.sh
  artifacts:
    paths:
      - build-dlfw
    expire_in: 48 hrs
  allow_failure: false

