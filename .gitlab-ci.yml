    - when: always
  tags:
    - cqa_host_runner
  script:
    - bash $CI_BUILDS_DIR/CI/ci_perftest.sh

replay-multi-gc:
  stage: replay_tests
  rules:
    - when: always
  needs: [build-classic]
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    NCCL_DEBUG: "WARN"
    SALLOC_RESNET: "salloc --exclusive -t 00:05:00 -N 2 -n 8 -w gc[01-02]"
    SALLOC_SELF_MULTI: "salloc --exclusive -t 00:05:00 -N 2 -n 16 -w gc[01-02]"
    SALLOC_SELF_SINGLE: "salloc --exclusive -t 00:05:00 -N 1 -n 8 -pP100"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - SALLOC=$SALLOC_RESNET ./test/scripts/gitlab-runner-replay-test.sh test/replay/traces/resnet_2x4_trace.txt
    - ./test/scripts/gitlab-runner-replay-self-test.sh
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs
