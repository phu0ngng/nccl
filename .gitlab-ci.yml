unit_tests-eos:
  stage: unit_tests
  rules:
    - if: $RUN_ON_EOS == "1"
      when: always
    - when: never
  needs: ["build-eos-aws-oci"]
  tags:
    - nccl-eos
  variables:
    CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/eos-config.sh"
    SLURM_TIME: 20
    NNODES: 1
    NGPUS: 8
    NP: 1
    NCCL_HOME: build-eos
    RUN_MODE: "MPI"
    SLURM_ACCOUNT: coreai_libraries_nccl
    DISABLE_MEMLEAK: "0" # Enable after addressing https://nvbugspro.nvidia.com/bug/4868411
    SRUN: "" # Needs to be empty for CI runner scripts performing cluster jobs
    PLANNED_RESERVED: "Planned"
    MPI_PARAMS: "--oversubscribe -n 2 -mca btl tcp,self"
  script:
    - export SALLOC="salloc -N ${NNODES} --ntasks-per-node ${NP} --exclusive --account=${SLURM_ACCOUNT} -J "${SLURM_ACCOUNT}-cicd::${GITLAB_USER_LOGIN}:unit::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME}"
    - $SALLOC ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

unit_tests-AWS_H100_EFA:
  stage: unit_tests
  rules:
    - if: $RUN_ON_AWS == "1"
      when: always
    - when: never
  needs:
    - setup-AWS_H100_EFA
  tags:
    - aws_p5
  variables:
    GIT_STRATEGY: none
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
    RUN_SCRIPT: run_${CI_JOB_NAME}.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-unit.sh
    JUNIT: junit_results_unit.xml
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/aws-config.sh"
      export SLURM_TIME=15
      export SLURM_PARTITION=compute
      export NNODES=1
      export NGPUS=8
      export NP=1
      export GRAPH=0
      export DISABLE_MEMLEAK_NETWORK=1
      export DISABLE_MEMLEAK=1
      export NCCL_HOME=build-eos
      export LD_LIBRARY_PATH=build-eos/lib:$LD_LIBRARY_PATH
      export RUN_MODE="SALLOC_MPI"
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export JUNIT=$JUNIT
      $TEST_CMD
      EOF
    - rsync -I -c $RUN_SCRIPT $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR
  script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && JUNIT=junit_results_unit.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $AWS_HEAD_NODE_WORKDIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/failed .
    - scp $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/$JUNIT .
    - ls && ls failed && ls $JUNIT
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

