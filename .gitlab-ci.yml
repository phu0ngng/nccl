replay-multi-gc:
  stage: replay_tests
  rules:
    - if: $TRIGGER_PIPELINE == "nightly" || ($RUN_ON_P100 == "1" && $RUN_REPLAY_TESTS == "1")
      when: always
    - when: never
  needs: [build-ipp6]
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    NCCL_HOME: build
    NCCL_DEBUG: "WARN"
    SALLOC_RESNET: "salloc --exclusive -t 00:05:00 -N 2 -n 8 -w gc[01-02]"
    SALLOC_SELF_MULTI: "salloc --exclusive -t 00:05:00 -N 2 -n 16 -w gc[01-02]"
    SALLOC_SELF_SINGLE: "salloc --exclusive -t 00:05:00 -N 1 -n 8 -pP100"
  script:
    - source docker/clusters/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - SALLOC=$SALLOC_RESNET ./test/scripts/gitlab-runner-replay-test.sh test/replay/traces/resnet_2x4_trace.txt
    - ./test/scripts/gitlab-runner-replay-self-test.sh
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 48 hrs

