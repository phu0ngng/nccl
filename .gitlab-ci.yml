    - if: $RUN_ON_DRACO_OCI == "1" && $RUN_UNIT_API_TESTS_ON_DRACO_OCI == "1"
      when: always
    - when: never
  needs:
    - build-eos-aws-oci
  tags:
    - draco-oci-iad
  variables:
    NNODES: 1
    NGPUS: 8
    SRUN: "" # Needs to be empty for CI runner scripts performing cluster jobs
    TEST_CMD: ./test/scripts/gitlab-runner-unit.sh
    TIMEOUT: "00:10:00" # HH:MM:SS
  script:
    - source docker/draco-oci-config.sh && configure_test_env
    - srun --exclusive --nodes $NNODES --gpus-per-node $NGPUS --account=$SLURM_ACCOUNT -J "$SLURM_ACCOUNT-cicd::${GITLAB_USER_LOGIN}::unit::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t $TIMEOUT $TEST_CMD

