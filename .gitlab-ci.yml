stages:
  - build
  - perf_tests_single

variables:
  RUN_MULTI_REGRESSION: "0" # Set to 1 to run multinode regression pipeline
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  REGRESSION_BASELINE: "v2.15.5-1" # Compare to stable branch (Update git tag as necessary)
  REGRESSION_THRESHOLD: 7 # What percent difference should we use to compare?
  REGRESSION_ITERATIONS: 5 # How many iterations should we run latency and overhead tests?
  REGRESSION_CHECK_CPU_OVERHEAD: 0 # Should we run CPU overhead tests in the perf regression?
  MULTI_REGRESSION_SALLOC_TIME: 45 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  SINGLE_REGRESSION_SALLOC_TIME: 30 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  SHARP_MULTI_JOB_TIME:  10
  RUN_ON_SELENE_SHARP: "0"
  BUILD_TRACE: "0"
  RUN_ON_AWS: "1"
  RUN_ON_EOS: "1"
  RUN_ON_DRACO_OCI: "1"
  RUN_UNIT_API_TESTS_ON_DRACO_OCI: "0" # TODO (kartiki/bewilliams) - Enable after addressing https://nvbugspro.nvidia.com/bug/4861033
  PLANNED_RESERVED: "Reserved"

default:
  # set all jobs to interruptible by default
  interruptible: true

# Run our CI on:
# - Every commit to master
# - Every commit to a merge request
# - Schedules (nightlies and weeklies)
# - Merge requests without "Draft:" in the title
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && ($CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'schedule' || $CI_PIPELINE_SOURCE == 'web' || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable" || $CI_COMMIT_BRANCH == $NCCL_RELEASE_BRANCH)
  # when cancelling a redundant pipeline, cancel all jobs that are interruptible
  auto_cancel:
    on_new_commit: interruptible

build-classic:
  stage: build
  tags:
    - build-with-docker
  script:
    - docker/make.sh gc-classic
  artifacts:
    paths:
      - build
    exclude:
      - build/**/*.o
    expire_in: 4 hrs

nic-fusion-A40:
  stage: perf_tests_single
  rules:
    - when: always
  needs: [build-classic]
  tags:
    - a40
  variables:
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
    NNODES: 1
    NGPUS: 2
    SALLOC: "salloc --exclusive -t 00:10:00 -N ${NNODES} -pA40"
  script:
    - pushd ext-net/mock
    - make
    - popd
    - chmod +x ./test/scripts/gitlab-runner-mock-nic-fusion.sh
    - ./test/scripts/gitlab-runner-mock-nic-fusion.sh test/nic-fusion/mock-a40-mixed-graph.xml
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 4 hrs
