## Stage: unit_tests - Start...
##

unit_tests-P100:
  stage: unit_tests
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && $RUN_ON_P100 == "1" && $RUN_UNIT_TESTS == "1"
      when: always
    - when: never
  needs: ["build-classic","health-P100"]
  tags:
    - p100
  variables:
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/clusters/gc-classic-config.sh"
    SLURM_TIME: 10
    SLURM_PARTITION: "P100"
    NNODES: 1
    NGPUS: 8
    NP: 1
    NCCL_HOME: build-gc
    RUN_MODE: "SALLOC_MPI"
    ENQUEUE_TESTS_ARGS: 1
    ENQUEUE_TESTS_FIFO: 1
    GRAPH_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_DEFAULT: 1
    MEMLEAK_TESTS_NO_P2P: 1
    MEMLEAK_TESTS_NETWORK: 1
    FT_TESTS_DEFAULT: 1
    FT_TESTS_NO_P2P: 1
    FT_TESTS_NETWORK: 1
    PLUGIN_TESTS_NET_TUNER: 1
    LOG_ALGO_RS_TESTS: 1
    LOG_ALGO_AG_TESTS: 1
  script:
    - ./test/scripts/ci/gitlab-runner-unit.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

