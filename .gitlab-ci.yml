    - !reference [.theia, rules]
  needs: ["build-theia"]
  variables:
    BUILD_DIR: "build-theia"
    INSTALL_DIR: "${THEIA_INSTALL_DIR}"
    CI_BUILDS_DIR: "${THEIA_CI_BUILDS_DIR}"

setup-bia:
  stage: setup
  extends:
    - .bia
    - .setup
  rules:
    - !reference [.pre_submit, rules]
    - !reference [.bia, rules]
  needs: ["build-bia"]
  variables:
    BUILD_DIR: "build-bia"
