summarize-pipeline:
  stage: summary
  dependencies: []
  rules:
    - when: always
  tags:
    - ipp6-nccl
  script:
    - ./test/scripts/gitlab-runner-summary.sh

# Kicks off an independent CI pipeline on QA nodes
