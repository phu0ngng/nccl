perf-regression-single-DGX-A100:
  stage: perf_regression
  rules:
    - if: $RUN_ON_SELENE == "1" && $CUDA_VERSION != "10.2" && $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - when: never
  needs: [build-eos-aws-oci]
  tags:
    - dgx-a100
  variables:
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/home/svcnccl/install/openmpi-1.10.7"
    CUDA_HOME: "/project/nccl/toolkits/cuda-${CUDA_VERSION}/"
    NVCC_GENCODE: " -gencode=arch=compute_80,code=sm_80"
    NCCL_CUMEM_ENABLE: "1"
    GPU_APPLICATION_CLOCK: 1410
  script:
    - ./test/scripts/gitlab-runner-build-baseline.sh $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - salloc -N 1 -n 8 --account=coreai_libraries_nccl -pluna -J "coreai_libraries_nccl-cicd::$GITLAB_USER_LOGIN:perftest-single-regression::$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA" -t $SINGLE_REGRESSION_SALLOC_TIME ./test/scripts/gitlab-runner-compare-perf.sh $REGRESSION_THRESHOLD $REGRESSION_ITERATIONS $REGRESSION_CHECK_CPU_OVERHEAD $CI_MERGE_REQUEST_DIFF_BASE_SHA
  cache:
    key: "build-${REGRESSION_BASELINE}"
    paths:
      - "build-${REGRESSION_BASELINE}/lib"
      - "build-${REGRESSION_BASELINE}/test/perf"
    key: "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
    paths:
      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/lib"
      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/test/perf"

