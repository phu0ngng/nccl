setup-AWS-H100-EFA:
  stage: setup
  extends:
    - .aws
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_AWS == "1"
      when: always
    - when: never
  needs:
    - job: build-ipp6
  variables:
    SETUP_SCRIPT: setup.sh
    REPO_DIR: ${WORKSPACE_DIR}/repo
  script:
    - set -e
    - rsync -aP --mkpath --inplace --exclude='.git' ./ $AWS_HEAD_NODE:$REPO_DIR/
    - |
      cat > $SETUP_SCRIPT << EOF
      #!/bin/bash -ex

      # Install NCCL build
      mv $REPO_DIR/build $WORKSPACE_DIR/

      # Configure workspaces for test suites
      echo unit api perftest-single perftest-multi | xargs -n 1 cp -r $REPO_DIR

      # Cleanup
      rm -rf $REPO_DIR
      EOF
    - rsync $SETUP_SCRIPT $AWS_HEAD_NODE:$WORKSPACE_DIR/
    - ssh $AWS_HEAD_NODE "cd $WORKSPACE_DIR && bash -l $SETUP_SCRIPT"

setup-pre-nyx:
  stage: setup
  extends:
    - .pre-nyx
    - .setup
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_PRE_NYX == "1"
      when: always
    - when: never
  needs: ["build-ipp6"]
  variables:
    BUILD_DIR: "build"
    INSTALL_DIR: "${PRE_NYX_INSTALL_DIR}"

setup-pre-tyche:
