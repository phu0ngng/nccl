apitest-AWS_H100_EFA:
  stage: api_tests
  rules:
    - if: $TRIGGER_PIPELINE =~ /^(pre-submit|post-submit|nightly)$/ || ($RUN_ON_AWS == "1" && $RUN_API_TESTS == "1")
      when: always
    - when: never
  needs:
    - [setup-AWS_H100_EFA,unit_tests-AWS_H100_EFA]
  tags:
    - ipp6-nccl
  variables:
    GIT_STRATEGY: none
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
    RUN_SCRIPT: run_${CI_JOB_NAME}.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-api.sh
    JUNIT: junit_results_apitest.xml
    API_TESTS_DEFAULT: 1
    API_TESTS_NO_P2P: 0 # NvBug 5210770
    API_TESTS_NETWORK: 1
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/clusters/aws-config.sh"
      export SLURM_TIME=20
      export SLURM_PARTITION=compute
      export NNODES=1
      export NGPUS=8
      export NP=1
      export NCCL_HOME=build
      export LD_LIBRARY_PATH=build/lib:$LD_LIBRARY_PATH
      export RUN_MODE="SALLOC_MPI"
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export JUNIT=$JUNIT
      export NCCL_NVLS_ENABLE=0
      export API_TESTS_DEFAULT=$API_TESTS_DEFAULT
      export API_TESTS_NO_P2P=$API_TESTS_NO_P2P
      export API_TESTS_NETWORK=$API_TESTS_NETWORK
      $TEST_CMD
      EOF
    - rsync -I -c $RUN_SCRIPT $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/
  script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $AWS_HEAD_NODE_WORKDIR && JUNIT=junit_results_apitest.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $AWS_HEAD_NODE_WORKDIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/failed .
    - scp $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/$JUNIT .
    - ls && ls failed && ls $JUNIT
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

