stages:
  - build
  # - unit_tests
  - api_tests
  - perf_tests_single
  # - perf_tests_multi
#  - perf_regression

variables:
  MULTI_PERFTEST_NODE_COUNT: 4
#  NCCL_REGRESSION_BASELINE: v2.9.9-1

build:
  stage: build
  rules:
    - when: always
  tags:
    - build
  variables:
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-11.3"
  script:
    - make -j test.build MPI=1 MPI_HOME=$MPI_HOME CUDA_HOME=$CUDA_HOME
  artifacts:
    paths:
      - build
    expire_in: 1 day
  interruptible: true

