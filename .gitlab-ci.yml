      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/lib"
      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/test/perf"

self-test-pytorch-container-eos:
  stage: perf_tests_single
  rules:
    - if: $RUN_ON_EOS == "1" && ( $RUN_DLFW_TESTS == "1" || $CI_PIPELINE_SOURCE == 'schedule' )
      when: always
    - when: never
  tags:
    - nccl-eos
  needs:
    - build-dlfw-pytorch-container
  parallel: 4
  variables:
    CONTAINER: gitlab-master.nvidia.com/dl/dgx/pytorch:main-py3-devel
    CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/$GITLAB_USER_LOGIN/gitlab-runner"
  script:
    - chmod +x test/scripts/dlfw/*.sh
    - srun -N1 --exclusive -t60 -A coreai_libraries_nccl -J coreai_libraries_nccl-bewilliams.test-cont --container-image="$CONTAINER" --container-mounts=$(pwd):/workspace/nccl /workspace/nccl/test/scripts/dlfw/run_dlfw_selftest.sh
  timeout: 48 hours

perf-regression-multi-DGX-A100:
  stage: perf_regression
  rules:
    - if: $RUN_ON_SELENE == "1" && $CUDA_VERSION != "10.2" && $CI_PIPELINE_SOURCE != "merge_request_event" && $RUN_MULTI_REGRESSION == "1"
      when: always
    - when: never
    - if: $REGRESSION_BASELINE == ""
      variables:
        REGRESSION_BASELINE: "${REGRESSION_BASELINE_TAG}"
  needs: [build-eos-aws-oci]
  tags:
    - dgx-a100
  variables:
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/home/svcnccl/install/openmpi-1.10.7"
    CUDA_HOME: "/project/nccl/toolkits/cuda-${CUDA_VERSION}/"
    NVCC_GENCODE: " -gencode=arch=compute_80,code=sm_80"
    NCCL_IB_SL: "1"
    NCCL_CUMEM_ENABLE: "1"
    OMPI_MCA_btl: "^openib"
    OMPI_MCA_btl_tcp_if_include: "enp97s0f1"
    GPU_APPLICATION_CLOCK: 1410
  script:
    - ./test/scripts/gitlab-runner-build-baseline.sh $CI_MERGE_REQUEST_DIFF_BASE_SHA
    - let NUM_PROCESSES=$MULTI_PERFTEST_NODE_COUNT*8 && salloc -N $MULTI_PERFTEST_NODE_COUNT -n $NUM_PROCESSES --account=coreai_libraries_nccl -pluna -J "coreai_libraries_nccl-cicd::$GITLAB_USER_LOGIN:perftest-multi-regression::$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA" -t $MULTI_REGRESSION_SALLOC_TIME ./test/scripts/gitlab-runner-compare-perf.sh $REGRESSION_THRESHOLD $REGRESSION_ITERATIONS $REGRESSION_CHECK_CPU_OVERHEAD $CI_MERGE_REQUEST_DIFF_BASE_SHA
  cache:
    key: "build-${REGRESSION_BASELINE}"
    paths:
      - "build-${REGRESSION_BASELINE}/lib"
      - "build-${REGRESSION_BASELINE}/test/perf"
    key: "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
    paths:
      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/lib"
      - "build-${CI_MERGE_REQUEST_DIFF_BASE_SHA}/test/perf"

QA-team-ci:
  stage: perf_regression
  rules:
    - when: always
  tags:
    - cqa_host_runner
  script:
    - mv build-gc build
    - bash $CI_BUILDS_DIR/CI/ci_perftest.sh

replay-multi-gc:
  stage: replay_tests
  rules:
    - when: always
  needs: [build-classic]
  tags:
    - p100
  variables:
    NCCL_IB_HCA: "mlx5_0"
    NCCL_HOME: build-gc
    NCCL_DEBUG: "WARN"
    SALLOC_RESNET: "salloc --exclusive -t 00:05:00 -N 2 -n 8 -w gc[01-02]"
    SALLOC_SELF_MULTI: "salloc --exclusive -t 00:05:00 -N 2 -n 16 -w gc[01-02]"
    SALLOC_SELF_SINGLE: "salloc --exclusive -t 00:05:00 -N 1 -n 8 -pP100"
  script:
    - source docker/gc-classic-config.sh && export CUDA_HOME=$(get_cuda_home) && export MPI_HOME=$(get_openmpi_home)
    - SALLOC=$SALLOC_RESNET ./test/scripts/gitlab-runner-replay-test.sh test/replay/traces/resnet_2x4_trace.txt
    - ./test/scripts/gitlab-runner-replay-self-test.sh
  artifacts:
    when: always
    paths:
      - "**/core.*.*"
    expire_in: 48 hrs

summarize-pipeline:
  stage: summary
  rules:
    - when: always
  tags:
    - build
  script:
    - ./test/scripts/gitlab-runner-summary.sh

profiler-tests-A100:
  stage: profiler_tests
  rules:
    - when: always
  needs: ["build-classic"]
  tags:
    - a100pci
  variables:
    NCCL_DEBUG: "WARN"
    CLUSTER_CONFIG: "docker/gc-classic-config.sh"
    SLURM_TIME: 10
    RUN_MODE: "SALLOC_MPI"
    SLURM_PARTITION: "A100"
    NNODES: 1
    ENABLE_NVLS: 0
    NGPUS: 4
    NP: 4
    NCCL_HOME: build-gc
  script:
    - ./test/scripts/ci/gitlab-runner-profiler.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs
