  stage: perf_tests_single
  rules:
    - if: '$RUN_ON_DRACO == "1"'
      when: always
    - when: never
  tags:
    - nccl-draco
  variables:
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/home/bewilliams/mpi/openmpi-1.10.7"
    CUDA_HOME: "/home/bewilliams/cuda/cuda/cuda-11.3"
    SALLOC: ""
  script:
    # TODO - Gain access to ci
    - srun -N 1 -n 8 --account=sw_gpucomms_nccl --nv-meta ml-model.nccl-perf -p batch_short_dgx1_m3 -t 00:05:00 ./test/scripts/gitlab-runner-perftest.sh 4G
  interruptible: true

