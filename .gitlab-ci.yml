perftest_multi-AWS-H100-EFA:
  stage: perf_tests_multi
  extends:
    - .aws
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_AWS == "1" && $RUN_PERF_TESTS_MULTIPLE == "1"
      when: always
    - when: never
  needs:
    - setup-AWS-H100-EFA
  variables:
    GIT_STRATEGY: none
    RUN_SCRIPT: run_tests.sh
    TEST_CMD: ./test/scripts/ci/gitlab-runner-perf.sh
    JUNIT: junit_results_perf_multi.xml
    TEST_WORKSPACE_DIR: ${WORKSPACE_DIR}/perftest-multi
    SLURM_TIME: 80
    NNODES: 2
    NP: 8
    MAX: 1G
    GRAPH: 0
    SKIP_FT_FINALIZE: 1
    DEVICE_API: 0 # No EFA support in GIN
  before_script:
    - |
      cat > $RUN_SCRIPT << EOF
      #!/bin/bash

      # Gitlab passthrough variables
      export CI_PIPELINE_ID=${CI_PIPELINE_ID}
      export CI_JOB_NAME=${CI_JOB_NAME}
      export CI_COMMIT_BRANCH=${CI_COMMIT_BRANCH}
      export CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      export GITLAB_USER_LOGIN=${GITLAB_USER_LOGIN}

      # CI infra variables
      export NCCL_DEBUG="WARN"
      export CLUSTER_CONFIG="docker/clusters/aws-config.sh"
      export SLURM_TIME=$SLURM_TIME
      export SLURM_PARTITION=$SLURM_PARTITION
      export NNODES=$NNODES
      export NGPUS=$NGPUS
      export NP=$NP
      export RUN_MODE=${RUN_MODE}
      export NCCL_HOME=${NCCL_HOME}
      export LD_LIBRARY_PATH=${NCCL_HOME}/lib:${LD_LIBRARY_PATH}
      export JUNIT=${JUNIT}

      # Perftest-multi variables
      export NCCL_NVLS_ENABLE=0
      export MAX=$MAX
      export GRAPH=$GRAPH
      export SKIP_FT_FINALIZE=$SKIP_FT_FINALIZE
      export DEVICE_API=$DEVICE_API
      export SKIP_MULTI_RANK_GPU=$SKIP_MULTI_RANK_GPU
      export SKIP_COMM_OPS_GROW_NVBUG_6029839=1 # see https://nvbugspro.nvidia.com/bug/6029839

      # Launch perftest-multi suite
      salloc -N ${NNODES} --exclusive -J "nccl-ci::${GITLAB_USER_LOGIN}:perftest-multi::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME} -p ${SLURM_PARTITION} $TEST_CMD
      EOF
    - rsync $RUN_SCRIPT $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/
  script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && bash -l $RUN_SCRIPT"
  after_script:
    - ssh $AWS_HEAD_NODE "cd $TEST_WORKSPACE_DIR && JUNIT=junit_results_perf_multi.xml bash -l ./test/scripts/ci/finalize-junit.sh"
    - ssh $AWS_HEAD_NODE "test -d $TEST_WORKSPACE_DIR/failed && echo 'Failed dir exists' " && scp -r $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/failed .
    - scp $AWS_HEAD_NODE:$TEST_WORKSPACE_DIR/$JUNIT .
  artifacts:
    when: always
    paths:
      - $JUNIT
      - $RUN_SCRIPT
      - "failed/**"
    reports:
      junit: $JUNIT
    expire_in: 48 hrs

