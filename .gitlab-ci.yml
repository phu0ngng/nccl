setup-AWS_H100_EFA:
  stage: setup
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && $RUN_ON_AWS == "1"
      when: always
    - when: never
  tags:
    - ipp6-nccl
  needs:
    - job: build-ipp6
      artifacts: false
  cache:
    key: "$CI_COMMIT_SHORT_SHA"
    paths:
      - build
    policy: pull
  variables:
    AWS_HEAD_NODE: aws-pcluster-head
    AWS_HEAD_NODE_WORKDIR: /shared/gitlab-runner/nccl-ci/${CI_COMMIT_SHORT_SHA}
  script:
    - rsync -I -c -a --exclude ./.git ./ $AWS_HEAD_NODE:$AWS_HEAD_NODE_WORKDIR/

##
## Stage: setup - Finish!
##

##
## Stage: health - Start...
##

health-P100:
  stage: health
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && ($RUN_ON_P100 == "1" || ($RUN_ON_P40 == "1" && $RUN_PERF_TESTS_MULTIPLE == "1"))
      when: always
    - when: never
  needs: []
  tags:
    - p100
  script:
    - srun --exclusive -t 00:02:00 -n 1 -c 8 -pP100 ./test/scripts/gitlab-runner-health-check.sh

health-P40:
  stage: health
  rules:
    - if: ($TRIGGER_PIPELINE == "default") && ($RUN_ON_P40 == "1" || ($RUN_ON_P100 == "1" && $RUN_PERF_TESTS_MULTIPLE == "1"))
      when: always
