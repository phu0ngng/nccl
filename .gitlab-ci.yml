    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
    SHARP_HOME: "/opt/hpcx/v2.7/sharp"
    PLUGIN_PATH: "/opt/nccl-rdma-sharp-plugins/src/.libs"
    NNODES: 3
    NGPUS: 8
