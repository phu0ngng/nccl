  variables:
    NCCL_IB_HCA: "mlx5_0"
    NCCL_DEBUG: "WARN"
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
    NCCL_ALLOC_P2P_NET_LL_BUFFERS: "1" # Add coverage of dedicated P2P LL buffers on constrained rank count
    NNODES: 3
    NGPUS: 8
    SKIP_MULTI_GPU: 1
    SALLOC: "salloc --exclusive -t 00:10:00 -N ${NNODES} --ntasks-per-node=${NGPUS} -w gc[01-02,05]"
  script:
    - ./test/scripts/gitlab-runner-perftest.sh 128M 0
  interruptible: true

