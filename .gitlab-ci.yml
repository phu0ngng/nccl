stages:
  - build
  - unit_tests
  - api_tests
  - perf_tests_single
  - perf_tests_multi
  - perf_regression
  - replay_tests

# Run our CI on:
# - Every commit to master
# - Every commit to a merge request
# - Schedules (nightlies and weeklies)
# - Merge requests without "Draft:" in the title
workflow:
  rules:
    - if: $CI_MERGE_REQUEST_TITLE !~ /^Draft:/ && ($CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_PIPELINE_SOURCE == 'schedule' || $CI_PIPELINE_SOURCE == 'web' || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "next" || $CI_COMMIT_BRANCH == "stable")

variables:
  RUN_MULTI_REGRESSION: "0" # Set to 1 to run multinode regression pipeline
  MULTI_PERFTEST_NODE_COUNT: 4
  CUDA_VERSION: "11.7"
  REGRESSION_BASELINE: "v2.15.5-1" # Compare to stable branch (Update git tag as necessary)
  REGRESSION_THRESHOLD: 7 # What percent difference should we use to compare?
  REGRESSION_ITERATIONS: 5 # How many iterations should we run latency and overhead tests?
  REGRESSION_CHECK_CPU_OVERHEAD: 0 # Should we run CPU overhead tests in the perf regression?
  MULTI_REGRESSION_SALLOC_TIME: 45 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  SINGLE_REGRESSION_SALLOC_TIME: 30 # How many minutes to salloc for multinode regression. This can be tuned for multinode pipelines
  API_TEST_CUMEM_ENABLE: 0
  SHARP_MULTI_JOB_TIME:  "00:10:00"

build:
  stage: build
  rules:
    - when: always
  tags:
    - build
  variables:
    MPI_HOME: "/opt/mpi/openmpi-1.10.7"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
  script:
    - echo "Using CUDA_HOME=$CUDA_HOME, MPI_HOME=$MPI_HOME"
    - make -j test.build MPI=1 MPI_HOME=$MPI_HOME CUDA_HOME=$CUDA_HOME
  artifacts:
    paths:
      - build
    expire_in: 1 day
  interruptible: true

unit_tests-A100:
  stage: unit_tests
  rules:
    - when: always
  needs: [build]
  tags:
    - build
  variables:
    NCCL_IB_HCA: "mlx5_0"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
  script:
    - srun --exclusive -t 00:10:00 -n 1 -c 8 -pA100 ./test/scripts/gitlab-runner-unit.sh
  interruptible: true

unit_tests-P100:
  stage: unit_tests
  rules:
    - when: always
  needs: [build]
  tags:
    - build
  variables:
    NCCL_IB_HCA: "mlx5_0"
    CUDA_HOME: "/usr/local/cuda-${CUDA_VERSION}"
  script:
    - srun --exclusive -t 00:10:00 -n 1 -c 8 -pP100 ./test/scripts/gitlab-runner-unit.sh
  interruptible: true

