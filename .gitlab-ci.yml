##
## Stage: profiler_tests - Start...
##

profiler-tests-ipp6-a100:
  stage: profiler_tests
  extends:
    - .ipp6-a100
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_IPP6 == "1" && $RUN_PROFILER_TESTS == "1"
      when: always
    - when: never
  needs:
    - setup-ipp6
  variables:
    SLURM_TIME: 10
    NNODES: 1
    ENABLE_NVLS: 0
    NP: 2
  script:
    - export SALLOC="salloc -N ${NNODES} --exclusive -J "cicd::${GITLAB_USER_LOGIN}::profiler-a100::${CI_COMMIT_BRANCH}:${CI_COMMIT_SHORT_SHA}" -t ${SLURM_TIME} -p ${SLURM_PARTITION} --comment=${CI_JOB_URL}"
    - $SALLOC ./test/scripts/ci/gitlab-runner-profiler.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

##
## Stage: profiler_tests - Finish!
##

##
## Stage: inspector_tests - Start...
##

inspector-tests-ipp6-a100:
  stage: inspector_tests
  extends:
    - .ipp6-a100
  rules:
    - <<: *pre_submit_rule
    - if: $RUN_ON_IPP6 == "1" && $RUN_INSPECTOR_TESTS == "1"
      when: always
    - when: never
  needs:
    - setup-ipp6
  variables:
    SLURM_TIME: 10
    NNODES: 1
    ENABLE_NVLS: 0
    NP: 2
    NCCL_SRC: ${CI_PROJECT_DIR}
    RUN_MODE: "SALLOC_MPI" # Inspector tests require SALLOC_MPI run mode
  script:
    - ./test/scripts/ci/gitlab-runner-inspector.sh
  artifacts:
    when: always
    paths:
      - "inspector_logs_*"
    expire_in: 48 hrs

