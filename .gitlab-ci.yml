    RUN_MODE: "SALLOC_MPI"
    SLURM_PARTITION: "A100"
    NNODES: 1
    ENABLE_NVLS: 0
    NGPUS: 4
    NP: 4
    NCCL_HOME: build-gc
  script:
    - ./test/scripts/ci/gitlab-runner-profiler.sh
  after_script:
    - ./test/scripts/ci/finalize-junit.sh
  artifacts:
    when: always
    paths:
      - "failed/**"
      - "junit_results.xml"
    reports:
      junit: junit_results.xml
    expire_in: 48 hrs

