  <line x1="390" y1="382" x2="390" y2="448" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="396" y="420" font-family="Arial,sans-serif" font-size="10" fill="#374151">C2C[395 GB/s]</text>

  <!-- CPU (center 390,465) w=120 h=34 -->
