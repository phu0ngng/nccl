  <text x="78" y="180" font-family="Arial,sans-serif" font-size="10" fill="#9ca3af">PCI 0002:81:00.0</text>

  <!-- DEV0 (center 165,200) w=175 h=34 -->
  <rect x="78" y="183" width="175" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
