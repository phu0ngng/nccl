<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#111">ncclTopoSystem — With mlopart</text>

  <!-- NVS (center 390,52) w=155 h=34 -->
  <rect x="313" y="35" width="155" height="34" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="390" y="53" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#713f12">NVS/0-0</text>
  <text x="390" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#92400e">(NVSwitch)</text>

  <!-- NVS → DEV0: (364,69) → (193,183) -->
  <line x1="364" y1="69" x2="193" y2="183" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="267" y="120" text-anchor="end" font-family="Arial,sans-serif" font-size="10" fill="#374151">NVL[684 GB/s] (50%)</text>

  <!-- NVS → DEV1: (416,69) → (587,183) -->
  <line x1="416" y1="69" x2="587" y2="183" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="513" y="120" font-family="Arial,sans-serif" font-size="10" fill="#374151">NVL[684 GB/s] (50%)</text>

  <!-- PCI bounding box (dashed) around DEV0 and DEV1 -->
