  <line x1="624" y1="217" x2="689" y2="348" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="666" y="282" font-family="Arial,sans-serif" font-size="10" fill="#374151">LOC[5000 GB/s]</text>

