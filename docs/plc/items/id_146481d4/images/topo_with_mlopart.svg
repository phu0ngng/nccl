  <rect x="298" y="348" width="185" height="34" rx="6" fill="#fde8d8" stroke="#f97316" stroke-width="1.5"/>
  <text x="390" y="363" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#7c2d12">XC2C/0-281000</text>
  <text x="390" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#9a3412">(C2C bridge)</text>

  <!-- GPU1 (center 700,365) w=155 h=34 -->
  <rect x="623" y="348" width="155" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="370" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#14532d">GPU/0-281003</text>

