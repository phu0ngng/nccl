# All the information that the users provide
# each config must be "name = value", they will be exported in the generated script
# there are four levels of configuration: global/system/run_env/library
# the precedence is: library > run_env > system > global
# if the same key is defined in different levels, the highest precedence level will be used
# the special key "sbatch" is used to define sbatch directives, it must be a list of strings
# the list of "sbatch" in different levels will be merged in order of precedence
# the special key "pyxis" is used to define pyxis arguments, it must be a list of strings
# the list of "pyxis" in different levels will be merged in order of precedence
# the special key "prologue_commands" is used to define commands to be executed before tests
# the special key "epilogue_commands" is used to define commands to be executed after tests
# both prologue_commands and epilogue_commands are strings and follow normal precedence rules

# TODO: Inherit CUDA_HOME and other variables from cluster configs

[EOS]
CUDA_HOME = "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
sbatch = [
    "--account=coreai_libraries_nccl"
]

[EOS.baremetal]
[EOS.baremetal.nccl]
NCCL_HOME = "${CI_PROJECT_DIR}/build"
NCCL_TEST_PATH = "${CI_PROJECT_DIR}/build/test/perf"
HPCX_HOME = "/lustre/fsw/coreai_libraries_nccl/toolkits/hpcx-v2.18-gcc-mlnx_ofed-ubuntu22.04-cuda12-x86_64"
LD_LIBRARY_PATH = "${CI_PROJECT_DIR}/build/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/lib:${LD_LIBRARY_PATH}"

prologue_commands = '''
source $HPCX_HOME/hpcx-init.sh
hpcx_load

if [ $SLURM_JOB_NUM_NODES -gt 16 ]; then
    export USER_NCCL_IB_SL=1
else
    export USER_NCCL_IB_SL=0
fi
'''

epilogue_commands = '''
hpcx_unload
'''

[EOS.container]
[EOS.container.nccl]
NCCL_HOME = "${CI_PROJECT_DIR}/build"
NCCL_TEST_PATH = "${CI_PROJECT_DIR}/build/test/perf"
LD_LIBRARY_PATH = '''${NCCL_HOME}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}'''
pyxis = [
    "--container-image=nvcr.io/nvidia/nvhpc:23.1-devel-cuda-12.1",
    "--container-mounts=${LOG_DIR}:${LOG_DIR},${LOG_DIR}_DBG:${LOG_DIR}_DBG"
]

[CW-DFW]
sbatch = [
    "--account=coreai_libraries_nccl"
]

[CW-DFW.baremetal]
[CW-DFW.baremetal.nccl]
NCCL_HOME = "${CI_PROJECT_DIR}/build"
NCCL_TEST_PATH = "${CI_PROJECT_DIR}/build/test/perf"
# MPI_HOME = "/cm/shared/apps/openmpi4/gcc/4.1.5"
HPCX_HOME = "/lustre/fsw/portfolios/coreai/projects/coreai_libraries_nccl/toolkits/hpcx-v2.18"
LD_LIBRARY_PATH = '''${CUDA_HOME}/lib64:${NCCL_HOME}/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}'''

prologue_commands = '''
source $HPCX_HOME/hpcx-init.sh
hpcx_load

if [ $SLURM_JOB_NUM_NODES -gt 16 ]; then
    export USER_NCCL_IB_SL=1
else
    export USER_NCCL_IB_SL=0
fi
'''

epilogue_commands = '''
hpcx_unload
'''

[CW-DFW.container]
[CW-DFW.container.nccl]
NCCL_HOME = "${CI_PROJECT_DIR}/build"
NCCL_TEST_PATH = "${CI_PROJECT_DIR}/build/test/perf"
LD_LIBRARY_PATH = '''${NCCL_HOME}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}'''

[PreTyche]
sbatch = [
    "--account=coreai_libraries_nccl",
    "-p batch"
]

CUDA_HOME = "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
NCCL_HOME = "${CI_PROJECT_DIR}/build-pre-tyche"
NCCL_TEST_PATH = "${CI_PROJECT_DIR}/build-pre-tyche/test/perf"
MPI_HOME = "/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"
LD_LIBRARY_PATH = "${CUDA_HOME}/lib64:${MPI_HOME}/lib:${NCCL_HOME}/lib:${CUDA_HOME}/lib${LD_LIBRARY_PATH:+:LD_LIBRARY_PATH}"
