description = "WEEKLY_COMPREHENSIVE_SWEEP_INTER_NVLD_DGX"
library_name = "nccl"

[common]
path = "${NCCL_TEST_PATH}"

[common.sweep_envs]
NCCL_DEBUG = "WARN"
# Split sweep: full node vs 1 GPU per group (H100 = 8 GPUs/node)
NCCL_TESTS_SPLIT = ["default", "MOD 8"]

[common.sweep_args]
-t = 1
-g = 1
-f = 2
-n = 20
-w = 5
-b = "8"
-e = "16G"
-d = "float"

#############################################
# DEFAULT TESTS (no algo/proto override)
#############################################

[[test]]
name = "all_reduce"
binary = "all_reduce_perf"

[[test]]
name = "all_gather"
binary = "all_gather_perf"

[[test]]
name = "reduce_scatter"
binary = "reduce_scatter_perf"

[[test]]
name = "alltoall"
binary = "alltoall_perf"
[test.sweep_args]
-d = "uint8"

[[test]]
name = "sendrecv"
binary = "sendrecv_perf"
[test.sweep_args]
-d = "uint8"

#############################################
# LOCAL REGISTRATION TESTS (-R 1)
#############################################

[[test]]
name = "all_reduce_local_reg"
binary = "all_reduce_perf"
[test.sweep_args]
-R = 1

[[test]]
name = "all_gather_local_reg"
binary = "all_gather_perf"
[test.sweep_args]
-R = 1

[[test]]
name = "reduce_scatter_local_reg"
binary = "reduce_scatter_perf"
[test.sweep_args]
-R = 1

[[test]]
name = "alltoall_local_reg"
binary = "alltoall_perf"
[test.sweep_args]
-R = 1
-d = "uint8"

[[test]]
name = "sendrecv_local_reg"
binary = "sendrecv_perf"
[test.sweep_args]
-R = 1
-d = "uint8"

#############################################
# GIN SYMMETRIC TESTS (work multi-node)
# NCCL_IB_MERGE_NICS=0 disables NIC fusion
#############################################

[[test]]
name = "alltoall_symm_gin_proxy"
binary = "alltoall_perf"
[test.sweep_envs]
NCCL_GIN_TYPE = "2"
NCCL_IB_MERGE_NICS = "0"
[test.sweep_args]
-R = 2
-D = 3
-d = "uint8"

[[test]]
name = "alltoall_symm_hybrid"
binary = "alltoall_perf"
[test.sweep_envs]
NCCL_IB_MERGE_NICS = "0"
[test.sweep_args]
-R = 2
-D = 4
-d = "uint8"
